<script type="application/json" id="data">{"storage": "astro-pilot-partner-v2-3ae96d1ba3eef367", "title": "Survey for the partner", "lead": "Each question shows four descriptions. Choose the one that fits you best.", "facts": ["9 questions, about 45 minutes.", "A second choice is optional.", "Your answers are saved in this browser as you go.", "You can take a break after question 5."], "rule": "Please answer on your own, without comparing notes until you have both finished.", "banner": null, "reply_header": "PARTNER'S ANSWERS (partner sheet, questions 1 to 9)", "copy_label": "Copy my answers", "pause_after": 5, "questions": [{"number": 1, "title": "Your basic temperament", "text": "Which of these four descriptions fits you best? Topic: Your basic temperament.", "options": [{"letter": "A", "text": "In a room full of people you barely know, you take a seat where you can see the door and spend the first half hour listening, working out who holds the power, who is pretending and who is about to leave; only then do you choose one person and walk over. Strangers read this as coldness. They see a level stare, short answers and a face that gives nothing away, and they decide you are judging them, when in fact you are deciding whether it is safe to be warm. Underneath that guarded front sits someone soft and sentimental, who keeps old birthday cards, remembers what everyone ate at a dinner long ago and feels a friend's bad news in the stomach. The people who get past the first wall are surprised by how much you want them close: you feel well only when there is at least one person whose door you can knock on at midnight and who would knock on yours. Being kept at arm's length by someone you have let in hurts you more than any open quarrel. Your days do not run on a steady track. You go through fierce spells of order, when you rise early, clear the desk, plan every meal and tick off lists with real pleasure, and then something unsettles you and the whole system collapses for a week into late nights, takeaway food and unanswered messages. You rebuild it each time from scratch rather than repairing the old one, and you are quietly embarrassed by how often you have had to."}, {"letter": "B", "text": "In a room full of strangers you do not work the crowd. You find the one person who seems worth the effort, usually someone standing slightly apart, and you stay with them for most of the evening, asking questions that go further than small talk normally allows. Newcomers read your composure as distance: your face stays still, your replies are short and dry, and more than one friend has admitted that they thought you disliked them for the first few weeks. The truth runs the other way. What keeps you well is having a few people properly close, people who know your moods and whom you can phone late without explaining why, and when one of them drifts you feel it physically, as if a wall of your home had gone. You hold that closeness inside a fixed shape. You eat at the same times, take the same route, keep the same seat, and a cancelled plan or an unexpected guest throws you more than you admit. The contradiction is that every so often the frame cracks from inside: after weeks of keeping everything exactly in order you make one large, abrupt decision, quitting something, booking something, saying the thing you had held back, and then you spend the following weeks rebuilding the routine around the consequences as if nothing unusual had happened. People who only see the order are surprised by the outbursts; people who only see the outbursts would not believe how carefully you live the rest of the time. You prefer the order, and you do not fully trust the part of you that breaks it."}, {"letter": "C", "text": "In a room full of strangers you stand back for the first quarter of an hour, holding a drink you are not drinking, working out who is in charge, who is bluffing and which conversation is worth joining. Only then do you step in, usually with a precise question that makes someone stop and think. Because of that opening reserve, people meeting you for the first time decide you are aloof or judging them, and are surprised weeks later to find you are the one sending them articles at midnight and arguing cheerfully about them over breakfast. What keeps you well is a steady supply of things to chew on: a problem nobody has solved, a book that contradicts the last one, a person who disagrees with you intelligently. A week of small talk and repetitive tasks leaves you flat and short-tempered, however comfortable the rest of your life is. You run your days inside a fixed frame, the same wake-up time, the same desk, the same route, and then change everything inside it: a new subject every month, a different way of doing the same job, furniture moved around a familiar room. When someone else tries to rearrange the frame itself you dig in far harder than the issue deserves. The cost of all this is that you come across as more detached than you feel. You keep a careful watch on how you are received, rehearse remarks before making them, and replay the clumsy ones for days, while the people around you assume you have not given them a second thought."}, {"letter": "D", "text": "In a room full of strangers you hang back for the first stretch, holding a drink you are not drinking, working out who knows whom and which conversation is worth joining. When you do step in, it is with one precise remark that lands, and people decide on the strength of that dry first line that you are aloof, a bit superior and hard to please. They are wrong, and they find out later: underneath the cool delivery there is a soft, almost sentimental streak that gives money to strangers and remembers a friend's bad week months afterwards. You rarely correct the first impression, partly because explaining yourself feels like asking permission. What you guard above everything is room to move. A job, a flat or a friendship that begins telling you when to arrive and how to behave turns, in your eyes, into a cage, and you quietly arrange an exit long before anyone notices you are unhappy. Your days run in waves rather than a steady line. For a few weeks you are up early, lists written, inbox empty, everything filed; then something breaks the spell and you live on takeaway and impulse, sleeping at odd hours and ignoring the lists you wrote. You are not troubled by this, because you trust that order will come back when you need it. The cost is that people who rely on your orderly phase are baffled by the other one, and you are impatient with anyone who asks you to explain which version is coming next. You would rather be thought cold than be managed."}]}, {"number": 2, "title": "Your emotional life", "text": "Which of these four descriptions fits you best? Topic: Your emotional life.", "options": [{"letter": "A", "text": "Pressure makes you sharp-tongued. When a deadline closes in or plans collapse, you answer questions with one clipped sentence, slam a cupboard, tell the nearest person exactly what they are doing wrong, and then feel the regret almost at once, because what you actually want is for everyone to be getting along. That swing from flare to apology is the pattern people around you know best: a burst of temper, then you are the first to come back, a little too eager to smooth things over and make a joke. Bigger feelings get different treatment: grief, jealousy, a hurt that will not settle. You take them apart. You write long notes to yourself, compare what happened with other times, read about why people feel this way, and do not rest until the feeling has a name and an explanation. Friends who want you simply to cry or rage get a well-argued account instead, and they find it hard to comfort someone who has already filed the case. What gets under your skin fastest is someone who refuses to consider a different view, the relative who repeats the same opinion at every dinner, the colleague who dismisses an idea because it is unfamiliar. You argue with them long after you should stop. After a hard stretch you do not hide away; you want an evening with two or three good friends, a long meal and conversation that wanders, and you feel restored once you have told the whole thing out loud and heard someone laugh at it."}, {"letter": "B", "text": "Pressure makes you short-tempered before it makes you anything else. When a deadline closes in or plans fall apart, the people nearest you hear it first, in a clipped reply, a slammed cupboard, a sharp comment about how slowly they are moving. Whatever you feel reaches your face and your voice within seconds; hiding irritation, disappointment or delight is beyond you, and anyone at the table knows your mood before you have said a word. The flare is quick and so is the cooling: an hour later you have forgotten the exchange, while the person you snapped at is still smarting, and you are honestly surprised to learn it mattered. What lights the fuse fastest is someone deciding things on your behalf: a relative who reorganises your plans, a friend who books the table without asking, a colleague who checks your work over your shoulder. Being managed feels like being caged, and you push back hard, even when the other person meant well. Yet the feelings you show so readily are the loud ones. Hurt, loneliness and tenderness go somewhere much further back, and you would rather be thought angry than be seen to be wounded, so people who only know your temper misread what upset you. After a hard stretch you do not want to talk it over or curl up on the sofa. You need to move: a long run, a hard session at the gym, an afternoon digging or carrying something heavy until your body is tired enough for your head to go quiet. Only then do you face the conversation you have been avoiding."}, {"letter": "C", "text": "When things go wrong you disappear inward. Your voice gets flatter, your replies shorter, and you find reasons to be in another room, while your mind goes over the problem from every angle without letting anyone in on it. Feeling, for you, arrives at full strength and is then locked away to be dealt with privately, often late at night, and you come out the other side having decided something you never discussed. People close to you learn about your worst weeks long afterwards, in a single sentence. What you cannot forgive is being lied to. A small, convenient untruth from a friend, the kind most people shrug off, changes how you see that person for good; you say nothing, but you start checking what they tell you, and you keep a quiet record. The awkward part is that you guard your own inner life just as closely as you resent others for guarding theirs, so you demand a frankness you rarely offer. You also pick up other people's moods through the walls: a tense silence at the dinner table ruins your evening before anyone has said a word, and you struggle to tell whether the heaviness is yours or theirs. After a hard stretch you go to ground at home. You want your own kitchen, a familiar meal cooked slowly, the blanket you have had for years and the same series watched again, and you are irritable with anyone who suggests going out to cheer you up. Recovery comes from the rooms around you staying exactly as they were."}, {"letter": "D", "text": "When pressure builds you go quiet and pull inward. You stop replying, cancel plans and spend long evenings in your room turning the problem over, and the people around you notice only that you have become polite and unreachable. Strong feeling gets the same treatment. You do not cry in front of others and you do not ask for advice; you take the hurt away, sit with it for days or weeks, and mention it only once it has been sorted into something you can say calmly. What gets under your skin fastest is being lied to, even about something small. You notice the half-truth at once, the story that changed slightly the second time it was told, and from then on you watch that person closely while saying nothing, keeping a private record you can recite word for word long after they have forgotten. The awkward part is that you are far less open than you demand others be: you expect complete honesty from people to whom you have told almost nothing After a hard stretch you do not want a party or a long talk. You want your own bed, a familiar meal cooked slowly, the same old programme on the screen and a cupboard you know is full. An old ache about being let down by someone who should have looked after you sits under all of this, and it is why those comforts matter so much: each time you are rebuilding the care you once went without. A sudden change at home, a move or a flatmate leaving, shakes you more than you admit."}]}, {"number": 3, "title": "Love and attraction", "text": "Which of these four descriptions fits you best? Topic: Love and attraction.", "options": [{"letter": "A", "text": "You rarely fall for someone you have just met. Your attractions grow out of friendships, group chats, a shared class or a running argument about books or politics that slowly turns into something else, and often the other person notices before you do. What hooks you is a mind that keeps up: someone who answers a strange idea with a stranger one, who disagrees with you and wins the point now and then, and who has a life full of interests that do not include you. Looks and sweetness come a distant second. Yet the people you end up with are often more fiery than you are: quick to anger, blunt, impatient, and you like being stirred up by them more than you admit. Once you are involved you also build an idealised picture of the person, and you are honestly shocked when they turn out to be ordinary. The fear underneath is of being swallowed. A partner who wants to know your plans every evening, who expects you to drop friends, or who treats every free afternoon as time for the two of you makes you feel trapped within weeks, and you start inventing reasons to be busy. When a partner hurts you, there is no scene. You become courteous, brief and unreachable, answer questions with single words and go to bed early, and you keep this up for days. The other person has to drag the subject out of you, and when they do you explain the hurt in a calm, almost clinical way that leaves them feeling more judged than if you had shouted."}, {"letter": "B", "text": "You rarely fall for strangers. The people you end up with are almost always ones you have known for a while as friends, members of the same crowd, a study group, a chat that ran late every night, until one evening the conversation turns and you realise you have been courting for months without calling it that. What pulls you is a mind that can keep up. Looks and charm do little if the other person cannot argue with you about an idea and occasionally win; you are bored within weeks by someone who agrees with everything, however kind. Once you are together, your biggest fear is being swallowed. A partner who wants to know where you are every hour, who expects every weekend to be shared, or who treats your friends as rivals makes you feel caged, and you begin quietly planning evenings alone. Yet you want the bond itself to be serious and you are drawn to people with a certain intensity, which means you keep choosing exactly the kind of partner who wants more of you than you like to give. When you are hurt, you do not sulk or hint. You say so straight away, and loudly, often before you have worked out what you mean, and the argument that follows is hot and fast. The trouble is that your partner is then left to deal with heat from someone who, an hour earlier, was insisting on distance, and the ones who stay are those who can take both."}, {"letter": "C", "text": "You are drawn to the person who does not look back. The friendly, available ones bore you; the one who is half elsewhere, cool, a little out of reach, holds your attention for a long time, and you set about winning them with a patience that surprises people who think you easygoing. Once decided, you go after it seriously: learning what they like, turning up where they will be. What you want once you are in is everything: the late conversations about what they have never told anyone, the sense that the two of you are in on something no one else sees. A pleasant, light arrangement leaves you cold, and you end those quickly. The contradiction is that the people you chase are the ones least likely to give you that depth, because their distance is exactly what drew you. So you spend a lot of love on someone who keeps one foot out of the door, and you watch that foot closely. Your deepest fear is being made a fool of: finding the message, the second story, the friend who knew before you did. A small evasion about where they were sets off a search you are not proud of. When a partner does hurt you, you do not shout. You go cold. You answer in single words, stop touching them, and wait for them to notice and work out why, and you hold that freeze for days. Your partners learn that your silence is louder than any argument, and that you remember the offence long after you stop mentioning it."}, {"letter": "D", "text": "You rarely make the first move. Someone notices you, keeps finding reasons to sit near you and sends the message after the evening out, and you let them do the work while you watch for weeks how they behave when they are tired, late or turned down. Only after that long inspection do you say yes, and the yes is solid. What you want from them is someone you can count on: a partner who turns up when they said they would, keeps their money in order, remembers the dentist appointment and does not change plans on a whim. Flashy charm does little for you; a person who quietly fixes your bike earns far more. The fear running underneath is of being managed. You are drawn to strong-willed people, and with them you stay on guard for the first hint of being corrected, steered or told how to dress, what to buy or how to spend your weekends. A remark about your habits, made lightly, lands as a verdict, and you start a silent contest of wills that the other person does not know they have entered. There is a contradiction here: you choose partners for their firmness and then resent that firmness when it points at you. When a partner hurts you, you do not shout. You go cold. The temperature in the room drops, answers shrink to single words, touch stops, and you wait to see whether they notice and come to you. Some never work out what happened, and you hold that against them as well."}]}, {"number": 4, "title": "Vocation and ambition", "text": "Which of these four descriptions fits you best? Topic: Vocation and ambition.", "options": [{"letter": "A", "text": "Your work needs to put something you made in front of people. Design, writing, image-making, building a product people use: the right job for you ends with a finished thing that others see, use and talk about, and work that disappears into a file nobody opens drains you quickly. What drives you is novelty. You want to be the person who did it first or did it differently, and you lose interest in a task once it has become a matter of copying last year's version a little better. That pushes you towards newer fields, small teams with strange ideas, projects that do not yet have a name. Your working life so far has already split into two tracks running side by side, a main job or course and a separate project of your own, and you keep both alive because each feeds the other, even when it costs you sleep and leaves friends wondering when you rest. You aim high and you admit it less than you feel it. You want your name known in your field, not merely a comfortable post, and you measure yourself against the best people in it rather than against the people around you. The tension is that you want recognition from the very establishment you enjoy defying: you resent being judged by its rules, yet you watch closely who is praised and who gets the invitations, and it stings when it is not you. You would rather be admired for breaking the mould than promoted for fitting it, and you have turned down safer offers on exactly that ground."}, {"letter": "B", "text": "The work that fits you puts you face to face with one person at a time who needs something sorted: a student stuck on a problem, a client in a mess, a patient who wants the plain truth explained slowly. Desk work with no human on the other end drains you quickly, however well it pays. What keeps you going on a long day is the evidence that you made a concrete difference to somebody, a form finally filed, a skill finally learned, and you count those far more carefully than you count praise. That modest account of yourself is not the whole story. Underneath it sits a fierce wish to be the person who runs the place, sets the standards and is consulted when things go badly, and you are uncomfortable admitting how much you want it. You resent bosses who are careless with power, you study exactly how they got where they are, and you privately rehearse how you would do their job better. Your working path has the shape of one field entered early and then turned inside out by a single decisive break, a moment when you abandoned the version of the job you had been training for and rebuilt it around what you had learned about people. You stayed in the same field, but nobody who knew the earlier version of you would recognise the work you aim at now. You do not want a quiet niche. You want to end up at the top of your field, and you intend to get there by being indispensable rather than by pushing."}, {"letter": "C", "text": "The work that fits you is making something people will see and judge: design, performance, writing, image, anything where the result carries your name and your taste. You do not want to be the person who keeps the system running; you want to be the person whose piece is put on the wall. What drives you, though, is less applause than getting it right. You redo a finished piece because one detail is off, you study how the best in your field built their work, and praise for something you know is mediocre embarrasses rather than pleases you. That seriousness sits awkwardly beside the pleasure-seeking side of your talent, and it shows in how your working life is arranged: you run two lines at once, usually a dependable practical job or course that pays and keeps you respectable, and a creative project pursued in the evenings that you consider the real thing. You talk about the second line to few people and defend the first one to your family. The cost is a constant feeling of being split and behind on both, and a vagueness about which of the two you are actually aiming at that frustrates anyone trying to advise you. You also aim high. Quiet competence is not enough for you; you want to be the name others in your field mention, and you measure yourself against the very best rather than against your classmates. That makes you hard on yourself and impatient with mentors who praise steady progress, and it means you would rather turn down a safe offer than accept a ceiling you can already see."}, {"letter": "D", "text": "The work that suits you is making something out of words, images or ideas: writing, design, building a channel or a product, shaping how something is explained or presented. Routine production of other people's plans drains you within a season, and you do your best work when you are allowed to invent the format as well as fill it. What gets you out of bed is novelty. You want to be the one who tried the thing nobody had tried, who rearranged the process, who launched the side project that the official one later copies. Your working life is not one line but two or more running alongside each other: a paid job and a project you care about more, or two fields you keep stitched together, and you defend that split even when someone offers you a cleaner path. People who want you to choose one thing find you hard to manage. Your ambition is real, but it is pointed at independence rather than rank. You want enough skill, reputation and income to set your own hours and refuse work you dislike, and once you have that you lose interest in climbing. The contradiction is that you are also good at being visible: you are the person bosses put in front of clients or an audience, and you enjoy it more than you let on. You turn down promotions that come with meetings and keep saying yes to the stage. The weakness is follow-through: you start more than you finish, and a project that stops surprising you gets quietly abandoned before it pays."}]}, {"number": 5, "title": "How you think and talk", "text": "Which of these four descriptions fits you best? Topic: How you think and talk.", "options": [{"letter": "A", "text": "Before a hard decision you build a case. You gather the figures, list the options, check what happened to other people who chose each one, and you distrust any choice you cannot defend in writing, including the one your instinct liked first. Friends who decide on a hunch strike you as reckless, and you have talked more than one of them out of something by asking three questions they had no answer to. You speak more carefully than people expect from someone so quick. You choose a word, reject it, find a better one, and you go back to correct what you said yesterday if it was not quite accurate, which some people find admirable and others find exhausting. Sloppy phrasing in others bothers you enough that you point it out. When you learn something new you go to the source first: the manual, the textbook, the long article, the lecture series, and only when you understand the principle do you try it out. Being shown a trick without the reason behind it irritates you. Your attention, once caught, does not let go. You sink into one problem for an entire afternoon, forget to eat, ignore messages, and surface surprised that the light has changed. The contradiction is that your mind works best slowly and in depth, yet the people around you see the quick surface, the joke and the fast reply, and hand you ten small things at once, which you do badly and resent being asked to do."}, {"letter": "B", "text": "Faced with a hard choice, you gather information first. You compare the options in writing, look up what others have tried, list what each path would cost and refuse to commit until the reasoning holds together, even when everyone around you has already decided by instinct. Your speech does not match that patience. Once you have an opinion you state it plainly, without softening it for the room, and you would rather correct a mistake in public than let it pass to keep things pleasant. Colleagues value that you never make them guess what you think; some of them stop asking. New material goes in best through conversation. You understand a subject when you have argued about it with a group, explained it to a friend or heard three people disagree over it, and a manual read alone in silence leaves very little behind. Left to yourself, your attention wanders. In a lecture, a long meeting or the middle of a page you drift into scenes and plans of your own, and come back with no idea what was said in the last ten minutes. The two habits collide most when a decision matters to you personally. The careful weighing begins well, then a strong feeling cuts across it, you blurt out a verdict before the analysis is done, and you spend the following days defending in sharp words a conclusion you reached faster than your method allows. The friends you trust most are the ones who will interrupt you, tell you plainly you have not thought it through, and make you talk it out again."}, {"letter": "C", "text": "Hard decisions are not settled for you by spreadsheets. You collect the facts, but the answer arrives as a physical certainty, a tightening or a release in the stomach, and once it arrives you act on it and defend it against people who bring better arguments. You are right often enough that you have stopped apologising for this, and wrong in a particular way: when you badly want something to be true, your instinct quietly agrees with you. In conversation you say little until you have decided what you think. You listen, ask one pointed question, and let others fill the silence; when you do speak, it is short and lands harder than people expect, and you dislike being asked to explain yourself on the spot. To learn something you open it up. You would rather dismantle the gadget, read the source, trace the argument back to where it breaks, than follow a tutorial step by step, and you do not trust a method until you have found its weak point yourself. Your attention, once it catches, does not let go: you will spend a whole night on one problem or one subject, forgetting to eat, and resent being interrupted. The contradiction is between this slow, thorough way of understanding and the speed of your decisions. You will take something apart for weeks to understand it, yet choose a flat, a course or a friend in an afternoon on instinct alone, and you cannot fully explain why the two run on different rules."}, {"letter": "D", "text": "When a decision is hard you do not draw up a list of pros and cons. You picture how your mother, your closest friend or your colleagues will feel when they hear it, and you choose the option that leaves the fewest of them hurt, even when the figures point the other way. Afterwards you can explain the choice in practical terms, but the explanation comes after the feeling. In conversation you say little until you are certain. You let others talk, store what they say, and then make one slow, solid remark that settles the matter; being hurried into an answer makes you dig in and say nothing at all. You learn with your hands. Manuals bore you and lectures slide past you; you would rather start the job, make the mistake and remember it in your body, and a skill picked up that way stays with you for good. Your attention has a will of its own. You set out to finish a task and soon find yourself staring out of the window, deep in an imagined conversation or a scene that has nothing to do with the work in front of you. This drifting is where your best ideas come from, and also why you misread instructions, miss a line in an email or turn up at the wrong place on the right day. The contrast puzzles people: you are slow, deliberate and stubborn in what you say, yet behind that steady front your thoughts are wandering far away, and a friend who interrupts the daydream gets a blank look before you come back."}]}, {"number": 6, "title": "An earlier period of your life", "text": "Which of these four accounts best describes your life between the ages of 18 and 19 (about 2020 to 2022)?", "options": [{"letter": "A", "text": "Early in this period life still followed the shape it had always had, with the familiar rooms and familiar people, but a restlessness was building and you were already looking outward. Through the middle stretch the doors opened one after another with surprisingly little resistance. Learning moved to the centre: a course, a new subject or a whole new way of studying took over your days, and you found yourself reading, writing and talking about ideas far more than before, and for the first time explaining things to others rather than only absorbing them. Alongside it came a change of setting that felt like release rather than upheaval, a move to a new town, a first place away from the family, or long trips that made the old routine look small. It happened with less friction than you had feared, and the relief of it is a large part of how you remember those months. The real turning point arrived right in the middle of the period, in a short, crowded run of weeks when new people, offers and plans all landed together and you said yes to more than you could comfortably carry. That is the tension of the stretch: the outward story was one of expansion and lucky openings, while privately you were nursing an old doubt about whether you were good enough to deserve them. Towards its end the excitement settled into the steadier business of keeping up with everything you had begun."}, {"letter": "B", "text": "Early in this period your sense of who you were broke open. Plans that had seemed settled suddenly looked like someone else's, and you made an abrupt turn: a different course, a different crowd, a different way of presenting yourself, chosen fast and defended against people who thought it rash. Out of that came the main thread of these years, which was work in the plain daily sense. You took on, for the first time, a regular job or a fixed set of duties that depended on you, with hours, a routine and people expecting you to turn up, and you learned how much of your energy that kind of structure takes. Around the middle of the period came a second, heavier shift. Responsibility landed squarely on you: something you had treated as provisional became binding, and you had to decide whether you meant it. You chose to commit, and the weeks around that choice were tiring and sober, with less fun and more accounting for your time. Doors opened alongside the strain; someone with standing noticed what you could do and gave you more of it, and by the end of the period you had a small but real reputation for being reliable in a role you had not expected to hold. Running underneath all of this was a quieter inner change. You stopped taking your old beliefs on trust, read and argued your way to new ones, and came out of these years with a different idea of what you were for, more independent and less willing to fit in."}, {"letter": "C", "text": "This stretch opened quietly and turned in its middle. In the first part you were still finding your feet, more aware than before of how you came across, changing how you dressed and spoke, and trying to decide what you wanted to be known for. Then, around the halfway point, a door opened onto real work: an offer, a role, a first serious commitment in a field you cared about, and you said yes before you had fully weighed it. Almost at once that opening became a weight. For most of the second half you carried responsibility you had not carried before, with someone senior watching your results, fixed hours, and the uncomfortable discovery that enthusiasm was not enough and that you would have to learn the dull parts properly. At the same time the ground kept shifting under it. Plans were changed by others without warning, an arrangement you had relied on was torn up, and more than once you had to rebuild your schedule from nothing. Alongside the work, learning was the second thread. You were studying, formally or on your own, and that study bent towards the work: you dropped subjects that had no use, took up ones that did, and read well beyond what was asked because you could now see what it was for. By the end of the period you were no longer someone with interests; you were someone with a trade in progress and a few hard lessons about promises made too quickly."}, {"letter": "D", "text": "These were years in which the ground at home shifted under you. Early on the pressure was already there in the background: a duty landed on you that you had not chosen, someone in the family leaned on you, and you began to behave like the adult in rooms where you had recently been the child. For most of the period one relationship close to home, with your mother or whoever ran the household, was being broken down and rebuilt, through arguments, a move, illness or a quiet but final change in who depended on whom, and it was not reversible. The heaviest turn came towards the end. In a short stretch you were tested on who you were, your attention swung back towards home and family questions, and a sudden break came from outside, a decision someone else made, a plan cancelled, a door that shut without warning. Alongside this a romantic or close one-to-one bond became intense and all-consuming, carrying feelings you had no practice handling, and it was tangled up with the trouble at home rather than separate from it: the person you were close to became either a refuge from home or a reason for conflict with it. The contrast is sharp. Outwardly, near the end, doors opened, an offer or some recognition arrived and things looked promising, yet inwardly you were dealing with the loss of the old arrangement, and no one around you fully saw it. You came out of it more guarded, older than your friends, and less willing to rely on anyone you had not tested."}]}, {"number": 7, "title": "A recent period of your life", "text": "Which of these four accounts best describes your life between the ages of 20 and 21 (about 2022 to 2024)?", "options": [{"letter": "A", "text": "Early in this period the pressure arrived through work and responsibility. Whatever you had begun was put to a hard test: a demanding supervisor, a review you could not talk your way past, and a growing sense that you were carrying more than your share. You held on grimly and your mood sank under it; friends found you flatter and more serious than before, and you began to question whether the direction you had chosen was really yours. The real break came in the middle of the period. Within a few months the arrangement you had been enduring came apart: a role ended or was abandoned, a plan collapsed, and you found yourself deciding, with surprising coldness, to strip away what no longer fitted and begin again on different terms. It felt less like a choice than like something being torn out by the roots, and you came out of it changed in how you present yourself and in what you are prepared to put up with. Alongside this, your living situation was shaken loose. You moved, or left the home and the people you had been living with, and the familiar base you had relied on was replaced by somewhere newer and less settled, with a wider circle of people around it. Towards the end of the period things quietened into a long, sober reckoning rather than a new triumph, more clearing out than building. The tension was that the upheaval freed you while the work kept demanding steadiness, and you were asked to be dependable during the very months you were tearing your own life apart."}, {"letter": "B", "text": "This period opened with the tail end of earlier upheaval at work: a last round of changed plans and one more sudden rearrangement, after which things held still for a while. Then the focus moved to money. From early in the middle stretch you became preoccupied with earning, paying your own way and owning things that were yours, and you counted what came in and went out with a care that surprised people who knew you as vague about such matters. Generous impulses ran into this: for a while you spent freely on friends and on comfort, then pulled back hard when the totals arrived. The real test came in the last part of the period. For most of that stretch you were pushed to stand on your own: to cover your own costs, to stop leaning on someone else's support, and to show through steady effort rather than talk that you could manage. It was slow and tiring, long weeks of doing the same necessary things, and it changed how you carried yourself; you came out firmer, less willing to explain yourself, and with something put by that you had earned. Work ran alongside as the second thread. Towards the end a chance to grow appeared, a bigger role, more hours or a better-paid opening, and it came with friction: you wanted the gain but disliked what it asked of you, and you took on more than you could comfortably handle because the money made sense."}, {"letter": "C", "text": "This stretch began with the tail end of the earlier storm: early on a sudden break and a last round of upheaval at home finished playing out, and at the same time a first real foothold in work or a public role arrived and was quickly put to the test. Then the weight moved inward. Around the middle of the period something ran its course in your sense of who you were and what you believed: a set of ambitions, a picture of the person you were supposed to become, a group or an outlook you had taken on from others. You did not drop it in a dramatic scene. You stopped feeding it, spent more time alone, slept and dreamed more, and let it fade until you noticed it was gone. That middle stretch felt like drifting and like waiting, with a nagging sense that the direction people expected of you was no longer yours. Alongside this, work kept moving in a steadier way. Several small openings came, a better role, a useful contact, a piece of work that was noticed, and by the later part you had put down something more solid, more responsibility and a routine you had chosen rather than inherited. The tension of these years is that outwardly you looked more settled and capable than before, while inwardly you were dismantling the reasons you had given yourself for doing any of it. Towards the end your attention turned to pleasure, play and making things again, as if, having emptied the old purpose out, you were testing what you would actually enjoy."}, {"letter": "D", "text": "This was a period in which your working life settled and took shape. Early in it, things that had felt provisional began to hold: the course, the job or the craft you had been trying out became something you were recognised for, and an opening arrived that raised your standing in front of people whose opinion mattered to you. It did not feel like luck so much as the payoff for steady, unglamorous effort, and the effect was to fix you more firmly on one path rather than to scatter you. You took on more responsibility, said yes to commitments you would have avoided earlier, and found that a regular schedule suited you better than you expected. A feeling of having arrived somewhere came with it, and with that feeling came a clearer view of what was missing, so the satisfaction was mixed with restlessness at home and impatience with the people who still treated you as a beginner. The second shift came towards the end, and it was about you rather than your work. You began paying attention to your body and your appearance: a change in how you dressed, ate, trained or rested, a decision to stop running yourself into the ground, and a new readiness to put yourself forward in person. People noticed that you looked different and carried yourself differently. That later change mattered as much as the earlier one, because it gave the steadier working life a person able to sustain it, and by the end of the period you were less willing to sacrifice sleep and health for the sake of proving yourself."}]}, {"number": 8, "title": "The bond between you", "text": "Which of these four descriptions fits the two of you best? Topic: The bond between you.", "options": [{"letter": "A", "text": "What caught Person A and Person B at the start was how little they resembled each other. Person A sorts, checks and wants to know how a thing works; Person B drifts toward the feeling of a room and trusts a hunch, and each found the other's way of moving through a day compelling. Person B shows love by surprising Person A: a ticket bought on impulse, a plan sprung on a free afternoon, a small object left where Person A will find it, all delivered with a grin. Underneath the surprises Person B wants to hear, plainly and often, that Person A is still glad to be there. Person A is fond but sparing with those words and goes vague when pressed, which leaves Person B reading silences and asking again. It is Person B who suggests moving in together, texts first after a day apart and wants the whole evening shared; Person A loves Person B and still guards a corner of the week that belongs to nobody, and grows more distant the harder that corner is pushed on. The surprises are partly a way of getting the reassurance without asking for it, so when Person A meets a surprise coolly, Person B hears a verdict on the whole relationship. Where they come fully alive is on the move: a long trip with a loose plan, a foreign city, a train taken somewhere neither has been. Away from home the closeness question goes quiet, Person A relaxes, Person B stops checking, and they come back with stories they tell as a pair for years."}, {"letter": "B", "text": "What pulled Person A and Person B together was the conversation itself: an evening that was meant to be one drink turned into hours of trading stories, finishing each other's jokes and arguing for fun about things neither of them cared about. That running banter is still the glue, and friends notice that the pair have private phrases nobody else understands. Person B shows love by saying it, often and in detail: long messages in the middle of a working day, compliments that name exactly what Person B noticed. Person B also needs to hear it back. When Person A goes quiet for an afternoon, Person B reads the silence as a verdict and asks whether everything is all right between them. Person A, by contrast, guards a private corner: a closed door, a solo walk, an evening off with no explanation, and comes back warmer for it. The difficulty is that the moment Person A steps away to recharge is the moment Person B most wants to be told the bond is secure, so the reaching and the retreating feed each other unless Person A says plainly where they are going and when they will be back. Where the pair come alive is away from home: a flight booked on a whim, a city where neither speaks the language, a long drive with no fixed route. On the road the closeness Person B wants and the room Person A wants stop competing, because each gets it at once, and they come back with a fresh stock of stories that keeps the talk going for months."}, {"letter": "C", "text": "What pulled Person A and Person B together was bodily before it was anything else: across a room, the way the other moved and stood registered first, and the conversation came afterwards to justify it. Person A felt a warm, slightly dazzled pull toward Person B's boldness; Person B felt free to be forward and playful from the first evening. Person B shows affection by talking: long messages sent at odd hours, private nicknames, a joke saved all day for Person A. Gifts are rare and practical help is erratic; the words are the proof. What Person B needs most from Person A is room. Person B wants to keep separate friends, take a trip alone or change plans on the day without an inquiry, and reads any question about where Person B has been as a leash. Person A is the one who leans in. Person A wants the shared evenings, the settled routine of a home they both come back to, and a full account of the other's day, and Person A notices first when the replies get shorter. This is the tension that shapes the bond: the same quick, roaming mind that keeps Person B's messages flowing makes Person B slip out of the arrangements Person A builds, and Person A's wish to pin the evenings down is exactly what makes Person B restless. Where they meet without effort is in conversation. They argue about ideas for hours, swap articles and half-formed theories on long drives, and a late dinner spent talking is what both would name as the best of what they have."}, {"letter": "D", "text": "What pulled Person A and Person B together was how little alike they seemed. Person A arrived watchful, guarded and slow to show a hand, and found in Person B someone who talked about ideas, causes and strangers with open enthusiasm and no visible caution. Person B found in Person A a warmth that came out as style and generosity once the guard dropped, and neither had met anyone so foreign who felt worth the effort. Person B shows affection mainly through talk: long messages, a running commentary on the day, an article sent with a line about why it made them think of Person A, a compliment so exact that it lands harder than a hug. Physical gestures come less readily, and Person A, who wants affection to be shown and seen, has had to learn to hear love in sentences. What Person B needs most from Person A is room. Person B keeps friends, plans and opinions that do not run through the couple, and turns cool and evasive the moment a question about where they were sounds like a checkpoint. Person A is the one who reaches for more contact, wants the evening together and the plan made jointly, and reads Person B's independence as a quiet verdict on the relationship when it is nothing of the kind. The odd result is that this restless pairing does its best work indoors: choosing a place to live, furnishing it slowly, setting up routines for meals and money that both of them trust. The rooms they share hold them together better than any promise made out loud."}], "note": "In these two questions, Person A is your partner and Person B is you."}, {"number": 9, "title": "Friction and repair", "text": "Which of these four descriptions fits the two of you best? Topic: Friction and repair.", "options": [{"letter": "A", "text": "Between Person A and Person B, trouble rarely announces itself. Small grievances get filed away for weeks: the plan cancelled at short notice, the evening Person A spent with other people, the message left unanswered. Neither raises them at the time, and then one ordinary remark about a late arrival sets off the whole collected list at once, to the surprise of anyone watching. Once the row is under way, Person B presses: following Person A from room to room, repeating the question, wanting an answer now rather than tomorrow. Person A goes cold and still, gives one-word replies, and finally leaves the flat or shuts a door, which Person B takes as proof that the matter is being dodged. The subject underneath is nearly always the same, how much of their free time belongs to the couple and how much to each of them alone: a weekend away with friends, a hobby that eats every weekend, a wish for a night in without company. The odd thing is that a pair who explode so suddenly mend things so methodically. Once tempers drop, they sit down and go over the whole argument line by line, who said what, what it meant, what each of them will do differently, and the talk lasts until each feels heard; a quick hug and moving on does not count as settled for them. The same habit governs large choices. A new job, a move or a joint purchase is debated across many evenings, lists are drawn up and revised, and nothing is agreed until each of them says yes."}, {"letter": "B", "text": "Disagreements between Person A and Person B almost always open with Person B saying out loud what is wrong, often the same day and often before Person A has noticed any problem. Person A's first move is to go still: shorter answers, a sudden need to tidy or to leave the room, a polite agreement that is not agreement. The more Person B presses for an answer, the further Person A retreats, and Person B reads the retreat as contempt and presses harder. The subject that sets this off most often is money: who paid for what, whether a shared purchase was really agreed, how much of one person's savings should cover the other's plans. Person A keeps a private ledger of what belongs to whom; Person B treats money as something that flows through the couple and is hurt to discover that a separate account was being kept. Making up does not happen through a hug or a joke. Once the heat has gone, the two of them sit down, usually late at night, and go through the whole thing point by point until each has said exactly what they meant. Big decisions follow the same slow path: a move, a large purchase or a change of job is talked over across several weeks, with lists and second thoughts, and neither acts until both agree. The tension is that Person B wants every quarrel settled on the spot while their joint decisions crawl, and Person A, who stalls in the middle of a quarrel, is the one who insists on the long deliberation afterwards."}, {"letter": "C", "text": "Their arguments almost always begin with Person B saying the thing out loud. Person B notices a grievance, names it the same day, often standing in the middle of the problem itself, and expects an answer on the spot. Person A hears the first sentence and goes still: shorter replies, a locked expression, a sudden need to finish the dishes or leave the room, while the anger Person A will not show gets stored rather than spent. The harder Person B presses for a reaction, the further Person A withdraws, and Person B reads the silence as contempt, which raises the volume again. The subject they fight over most is time: how many evenings belong to the couple, whether Person B's friends, trips and late projects count as neglect, whether Person A's wish to know the plan is care or surveillance. Person B wants to come and go without reporting, Person A wants to be counted on, and each hears the other's need as a demand. The reconciliation comes from Person A, and not in words: a favourite meal cooked without comment, a hand on Person B's shoulder, a dry joke that signals the freeze is over. Person B, who would rather have the conversation, accepts the gesture and lets the argument stay unfinished. The strangest part is that on large matters, a lease, a move, a big purchase, the quieter Person A is the one who decides. Person B argues loudly over small things and then defers on the choices that bind them for years, trusting Person A's caution more than their own speed."}, {"letter": "D", "text": "Disagreements between Person A and Person B rarely begin as arguments. Something small irritates one of them, nothing is said, and the grievance is stored; weeks later a remark about an unanswered message or a plan changed without notice sets off a quarrel that is plainly about something older. Once it is open, Person B pushes: Person B speaks fast, names the problem bluntly, wants it settled that night and follows Person A from room to room to finish the point. Person A goes quiet, agrees to end it, and keeps the real objection back, which is why the same quarrel comes round again. The subject they fight over most is how much of their time belongs to the couple. Person B books a weekend with friends or stays out late without asking, Person A feels left out of a decision that affected both, and Person B hears the complaint as a demand to report in. The tension is that Person A avoids open confrontation yet keeps a quiet tally of these absences, while Person B, ready to fight at once, has forgotten the quarrel by morning. They make up without discussing it: a hand on the shoulder in the kitchen, a joke only the two of them understand, an evening on the sofa together, and the topic is dropped rather than resolved. On large choices, such as a move, a job or an expensive purchase, Person B moves first and announces the decision with conviction, while Person A raises the practical objections, goes along, and later reminds Person B whose idea it was."}], "note": "In these two questions, Person A is your partner and Person B is you."}]}</script>
<script>
"use strict";
const D=JSON.parse(document.getElementById('data').textContent);
const Q=D.questions,N=Q.length,L4='ABCD',$=id=>document.getElementById(id);
const SCR=['welcome'];
Q.forEach((q,i)=>{SCR.push('q'+i);if(D.pause_after&&q.number===D.pause_after&&i<N-1)SCR.push('break');});
SCR.push('finish');
let mode='local';
function blank(){return {a:{},out:{},screen:'welcome'};}
function clean(s){const t=blank();if(!s||typeof s!=='object')return t;
  Q.forEach(q=>{const v=(s.a||{})[q.number];if(Array.isArray(v)){const f=L4.includes(v[0])&&v[0]?v[0]:null,x=L4.includes(v[1])&&v[1]&&v[1]!==f?v[1]:null;if(f||x)t.a[q.number]=[f,x];}
    const o=(s.out||{})[q.number];if(Array.isArray(o))t.out[q.number]=o.filter(l=>L4.includes(l)&&l);});
  if(SCR.includes(s.screen))t.screen=s.screen;return t;}
function read(){try{const v=localStorage.getItem(D.storage);localStorage.setItem(D.storage+':probe','1');localStorage.removeItem(D.storage+':probe');return v?JSON.parse(v):null;}
  catch(e){mode='tab';try{return (JSON.parse(window.name||'{}')||{})[D.storage]||null;}catch(x){return null;}}}
let st=clean(read());
function save(){const v=JSON.stringify(st);
  if(mode==='local'){try{localStorage.setItem(D.storage,v);return;}catch(e){mode='tab';}}
  let w={};try{w=JSON.parse(window.name||'{}')||{};}catch(e){}w[D.storage]=st;try{window.name=JSON.stringify(w);}catch(e){}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ans=q=>st.a[q.number]||[null,null];
const outs=q=>st.out[q.number]||[];
const prompt=q=>q.text.replace(/\s*Topic:.*$/,'');
const answered=()=>Q.filter(q=>ans(q)[0]).length;
function setAns(q,f,s){if(!f&&!s)delete st.a[q.number];else st.a[q.number]=[f,s];}
function choose(q,l,which){let [f,s]=ans(q);
  if(which===0){if(f===l)f=null;else{f=l;if(s===l)s=null;}}
  else{if(s===l)s=null;else{s=l;if(f===l)f=null;}}
  st.out[q.number]=outs(q).filter(x=>x!==f&&x!==s);
  setAns(q,f,s);save();paint();}
function ruleOut(q,l){let o=outs(q),[f,s]=ans(q);
  if(o.includes(l))o=o.filter(x=>x!==l);else{o=o.concat([l]);if(f===l)f=null;if(s===l)s=null;setAns(q,f,s);}
  st.out[q.number]=o;save();paint();}
function replyText(){const R=[D.reply_header];Q.forEach(q=>{const [f,s]=ans(q);R.push(q.number+':'+(f?' '+f:'')+(f&&s?' '+s:''));});return R.join('\n');}
function header(){
  const cur=st.screen;
  $('steps').innerHTML=SCR.map(s=>{
    if(s==='welcome')return '';
    if(s==='break')return '<span class="gap" aria-hidden="true"></span>';
    if(s==='finish')return '<button type="button" data-go="finish" class="'+(cur==='finish'?'here':'')+'" aria-label="Finish"'+(cur==='finish'?' aria-current="step"':'')+'>End</button>';
    const q=Q[+s.slice(1)],f=ans(q)[0];
    return '<button type="button" data-go="'+s+'" class="'+(f?'done ':'')+(cur===s?'here':'')+'" aria-label="Question '+q.number+(f?', answered':', not answered')+'"'+(cur===s?' aria-current="step"':'')+'>'+q.number+'</button>';}).join('');
  $('count').innerHTML='<span>'+answered()+' of '+N+' answered</span><span>'+(mode==='local'?'Saved in this browser':'Not saved: keep this tab open')+'</span>';
  $('top').hidden=cur==='welcome';}
function go(s){if(!SCR.includes(s))return;st.screen=s;save();render();window.scrollTo(0,0);}
function step(d){const i=SCR.indexOf(st.screen)+d;if(i>=0&&i<SCR.length)go(SCR[i]);}
function render(){
  const m=$('main'),s=st.screen,banner=D.banner?'<div class="banner"><b>DEMO</b>'+esc(D.banner)+'</div>':'';
  header();
  $('back').hidden=s==='welcome';
  $('next').hidden=s==='finish';
  $('next').textContent=s==='welcome'?(Object.keys(st.a).length?'Continue':'Start'):s==='break'?'Continue':SCR[SCR.indexOf(s)+1]==='finish'?'Finish':'Next';
  $('keys').textContent=s[0]==='q'?'1 2 3 4 to choose, arrows to move':'';
  if(s==='welcome'){
    m.innerHTML=banner+'<h1>'+esc(D.title)+'</h1><p>'+esc(D.lead)+'</p>'+
      '<ul class="dots">'+D.facts.map(f=>'<li>'+esc(f)+'</li>').join('')+'</ul>'+
      '<p class="meta">'+esc(D.rule)+'</p>'+(mode==='local'?'':'<p class="meta">This browser does not keep progress for a page opened this way. Keep this tab open until you have copied your answers.</p>');
  } else if(s==='break'){
    const done=Q.filter(q=>q.number<=D.pause_after).length;
    m.innerHTML=banner+'<div class="rest"><p class="eyebrow">Break</p><h1>Questions 1 to '+done+' are answered</h1>'+
      '<p>You can stop here and come back later. '+(mode==='local'?'Your answers are saved in this browser, and the page will open at this point.':'This browser does not keep progress for a page opened this way, so keep this tab open.')+'</p></div>';
  } else if(s==='finish'){
    const miss=Q.filter(q=>!ans(q)[0]);
    m.innerHTML=banner+'<h1>Copy your answers</h1><p>Copy the text below and paste it into the chat.</p>'+
      (miss.length?'<ul class="warn">'+miss.map(q=>'<li>Question '+q.number+' has no choice yet. <a href="#" data-go="q'+Q.indexOf(q)+'">Go to question '+q.number+'</a></li>').join('')+'</ul>':'')+
      '<button type="button" class="btn primary copy" id="copy">'+esc(D.copy_label)+'</button><p class="meta" id="status" role="status"></p>'+
      '<textarea id="out" readonly aria-label="Your answers as text">'+esc(replyText())+'</textarea>'+
      '<h2>Your choices</h2><ol class="sum">'+Q.map((q,i)=>{const [f,x]=ans(q);return '<li><a href="#" data-go="q'+i+'"><span class="t">'+q.number+'. '+esc(q.title)+'</span><span class="ch'+(f?'':' none')+'">'+(f?f+(x?', then '+x:''):'none')+'</span></a></li>';}).join('')+'</ol>'+
      '<p style="margin-top:24px"><button type="button" class="link" id="clear">Clear my answers in this browser</button></p>';
  } else {
    const i=+s.slice(1),q=Q[i];
    m.innerHTML=banner+'<p class="eyebrow">Question '+q.number+' of '+N+'</p>'+(q.note?'<p class="couple">'+esc(q.note)+'</p>':'')+
      '<h1>'+esc(q.title)+'</h1><p class="prompt">'+esc(prompt(q))+' A second choice is optional.</p>'+
      q.options.map(o=>'<article class="opt" data-l="'+o.letter+'">'+
        '<div class="ohead"><button type="button" class="pick" data-l="'+o.letter+'" aria-pressed="false"><span class="letter">'+o.letter+'</span><span class="state"></span></button></div>'+
        '<p class="otext">'+esc(o.text)+'</p>'+
        '<div class="oact"><button type="button" data-second="'+o.letter+'" aria-pressed="false">Second choice</button><button type="button" data-out="'+o.letter+'" aria-pressed="false">Rule out</button></div></article>').join('');
    paint();
  }}
function paint(){
  const s=st.screen;if(s[0]!=='q'){header();return;}
  const q=Q[+s.slice(1)],[f,x]=ans(q),o=outs(q);
  document.querySelectorAll('.opt').forEach(c=>{const l=c.dataset.l,F=f===l,S=x===l,O=o.includes(l);
    c.className='opt'+(F?' first':S?' second':O?' out':'');
    const p=c.querySelector('.pick');p.setAttribute('aria-pressed',F);
    p.setAttribute('aria-label','Option '+l+(F?', your first choice':S?', your second choice':O?', ruled out':'')+'. Choose as first choice');
    c.querySelector('.state').textContent=F?'First choice':S?'Second choice':O?'Ruled out':'';
    const b2=c.querySelector('[data-second]');b2.hidden=F||O;b2.setAttribute('aria-pressed',S);b2.textContent=S?'Remove second choice':'Second choice';
    const bo=c.querySelector('[data-out]');bo.setAttribute('aria-pressed',O);bo.textContent=O?'Bring back':'Rule out';bo.hidden=F;});
  header();}
$('back').addEventListener('click',()=>step(-1));
$('next').addEventListener('click',()=>step(1));
document.addEventListener('click',e=>{
  const t=e.target,b=t.closest('[data-go],[data-second],[data-out],.pick,#copy,#clear');
  const s=st.screen,q=s[0]==='q'?Q[+s.slice(1)]:null;
  if(b){
    if(b.dataset.go!==undefined){e.preventDefault();go(b.dataset.go);}
    else if(b.dataset.second){choose(q,b.dataset.second,1);}
    else if(b.dataset.out){ruleOut(q,b.dataset.out);}
    else if(b.classList.contains('pick')){if(outs(q).includes(b.dataset.l))ruleOut(q,b.dataset.l);else choose(q,b.dataset.l,0);}
    else if(b.id==='copy'){copy();}
    else if(b.id==='clear'){if(confirm('Clear all your choices in this browser?')){st=blank();save();render();}}
    return;}
  const card=t.closest('.opt');
  if(card&&q){const sel=window.getSelection&&String(window.getSelection());if(sel)return;
    if(outs(q).includes(card.dataset.l))ruleOut(q,card.dataset.l);else choose(q,card.dataset.l,0);}
});
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='TEXTAREA'||e.altKey||e.ctrlKey||e.metaKey)return;
  const s=st.screen;
  if(e.key==='ArrowRight'){if(s!=='finish'){e.preventDefault();step(1);}return;}
  if(e.key==='ArrowLeft'){if(s!=='welcome'){e.preventDefault();step(-1);}return;}
  if(s==='welcome'&&e.key==='Enter'&&e.target===document.body){e.preventDefault();step(1);return;}
  if(s[0]!=='q')return;
  const code=e.code||'',d=/^(Digit|Numpad)([1-4])$/.exec(code),k=d?+d[2]:'1234'.indexOf(e.key)+1||'abcd'.indexOf(e.key.toLowerCase())+1;
  if(k>=1&&k<=4){e.preventDefault();choose(Q[+s.slice(1)],L4[k-1],e.shiftKey?1:0);}
});
function copy(){const t=$('out'),msg=$('status');t.value=replyText();
  const ok=()=>{msg.textContent='Copied. Paste it into the chat.';$('copy').textContent='Copied';setTimeout(()=>{$('copy').textContent=D.copy_label;},4000);};
  const fallback=()=>{t.focus();t.select();try{if(!document.execCommand('copy'))throw 0;ok();}catch(x){msg.textContent='Select the text in the box and copy it.';}};
  if(navigator.clipboard&&navigator.clipboard.writeText&&window.isSecureContext!==false)navigator.clipboard.writeText(t.value).then(ok,fallback);else fallback();}
render();</script>
</body></html>
