html{-webkit-text-size-adjust:100%;background:#F4F1EF}

p{margin:0 0 12px;text-wrap:pretty}

:focus-visible{outline:2px solid var(--text);outline-offset:2px}

.eyebrow{font-size:14px;color:var(--meta);margin:0 0 16px}
.meta{color:var(--meta);font-size:16px}
.prompt{color:var(--body);margin:0 0 24px}

.box{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:20px 24px;margin:0 0 24px}
.banner{border:1px solid var(--border);border-left:3px solid var(--warning);background:var(--surface);border-radius:6px;padding:10px 14px;margin:0 0 24px;font-size:15px;color:var(--body)}
.banner b{font-family:var(--mono);font-weight:500;color:var(--text);margin-right:8px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--border)}

.steps{display:flex;gap:4px}

.steps .gap{flex:0 0 8px;align-self:center;height:16px;border-left:1px solid var(--border);margin-left:4px}
.count{display:flex;justify-content:space-between;font-size:13px;color:var(--meta);margin-top:8px}
.couple{border-left:3px solid var(--text);padding:2px 0 2px 14px;margin:0 0 20px;color:var(--text)}

.opt.first{border-color:var(--text);box-shadow:inset 0 0 0 1px var(--text)}

.ohead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 10px}

ol.sum li{border-bottom:1px solid var(--border)}

function read(){try{const v=localStorage.getItem(D.storage);localStorage.setItem(D.storage+':probe','1');localStorage.removeItem(D.storage+':probe');return v?JSON.parse(v):null;}
  catch(e){mode='tab';try{return (JSON.parse(window.name||'{}')||{})[D.storage]||null;}catch(x){return null;}}}
let st=clean(read());
function save(){const v=JSON.stringify(st);
  if(mode==='local'){try{localStorage.setItem(D.storage,v);return;}catch(e){mode='tab';}}
  let w={};try{w=JSON.parse(window.name||'{}')||{};}catch(e){}w[D.storage]=st;try{window.name=JSON.stringify(w);}catch(e){}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ans=q=>st.a[q.number]||[null,null];
const outs=q=>st.out[q.number]||[];
const prompt=q=>q.text.replace(/\s*Topic:.*$/,'');
const answered=()=>Q.filter(q=>ans(q)[0]).length;
function setAns(q,f,s){if(!f&&!s)delete st.a[q.number];else st.a[q.number]=[f,s];}
function choose(q,l,which){let [f,s]=ans(q);
  if(which===0){if(f===l)f=null;else{f=l;if(s===l)s=null;}}
  else{if(s===l)s=null;else{s=l;if(f===l)f=null;}}
  st.out[q.number]=outs(q).filter(x=>x!==f&&x!==s);
  setAns(q,f,s);save();paint();}
function ruleOut(q,l){let o=outs(q),[f,s]=ans(q);
  if(o.includes(l))o=o.filter(x=>x!==l);else{o=o.concat([l]);if(f===l)f=null;if(s===l)s=null;setAns(q,f,s);}
  st.out[q.number]=o;save();paint();}
function replyText(){const R=[D.reply_header];Q.forEach(q=>{const [f,s]=ans(q);R.push(q.number+':'+(f?' '+f:'')+(f&&s?' '+s:''));});return R.join('\n');}
function header(){
  const cur=st.screen;
  $('steps').innerHTML=SCR.map(s=>{
    if(s==='welcome')return '';
    if(s==='break')return '<span class="gap" aria-hidden="true"></span>';
    if(s==='finish')return '<button type="button" data-go="finish" class="'+(cur==='finish'?'here':'')+'" aria-label="Finish"'+(cur==='finish'?' aria-current="step"':'')+'>End</button>';
    const q=Q[+s.slice(1)],f=ans(q)[0];
    return '<button type="button" data-go="'+s+'" class="'+(f?'done ':'')+(cur===s?'here':'')+'" aria-label="Question '+q.number+(f?', answered':', not answered')+'"'+(cur===s?' aria-current="step"':'')+'>'+q.number+'</button>';}).join('');
  $('count').innerHTML='<span>'+answered()+' of '+N+' answered</span><span>'+(mode==='local'?'Saved in this browser':'Not saved: keep this tab open')+'</span>';
  $('top').hidden=cur==='welcome';}
function go(s){if(!SCR.includes(s))return;st.screen=s;save();render();window.scrollTo(0,0);}
function step(d){const i=SCR.indexOf(st.screen)+d;if(i>=0&&i<SCR.length)go(SCR[i]);}
function render(){
  const m=$('main'),s=st.screen,banner=D.banner?'<div class="banner"><b>DEMO</b>'+esc(D.banner)+'</div>':'';
  header();
  $('back').hidden=s==='welcome';
  $('next').hidden=s==='finish';
  $('next').textContent=s==='welcome'?(Object.keys(st.a).length?'Continue':'Start'):s==='break'?'Continue':SCR[SCR.indexOf(s)+1]==='finish'?'Finish':'Next';
  $('keys').textContent=s[0]==='q'?'1 2 3 4 to choose, arrows to move':'';
  if(s==='welcome'){
    m.innerHTML=banner+'<h1>'+esc(D.title)+'</h1><p>'+esc(D.lead)+'</p>'+
      '<ul class="dots">'+D.facts.map(f=>'<li>'+esc(f)+'</li>').join('')+'</ul>'+
      '<p class="meta">'+esc(D.rule)+'</p>'+(mode==='local'?'':'<p class="meta">This browser does not keep progress for a page opened this way. Keep this tab open until you have copied your answers.</p>');
  } else if(s==='break'){
    const done=Q.filter(q=>q.number<=D.pause_after).length;
    m.innerHTML=banner+'<div class="rest"><p class="eyebrow">Break</p><h1>Questions 1 to '+done+' are answered</h1>'+
      '<p>You can stop here and come back later. '+(mode==='local'?'Your answers are saved in this browser, and the page will open at this point.':'This browser does not keep progress for a page opened this way, so keep this tab open.')+'</p></div>';
  } else if(s==='finish'){
    const miss=Q.filter(q=>!ans(q)[0]);
    m.innerHTML=banner+'<h1>Copy your answers</h1><p>Copy the text below and paste it into the chat.</p>'+
      (miss.length?'<ul class="warn">'+miss.map(q=>'<li>Question '+q.number+' has no choice yet. <a href="#" data-go="q'+Q.indexOf(q)+'">Go to question '+q.number+'</a></li>').join('')+'</ul>':'')+
      '<button type="button" class="btn primary copy" id="copy">'+esc(D.copy_label)+'</button><p class="meta" id="status" role="status"></p>'+
      '<textarea id="out" readonly aria-label="Your answers as text">'+esc(replyText())+'</textarea>'+
      '<h2>Your choices</h2><ol class="sum">'+Q.map((q,i)=>{const [f,x]=ans(q);return '<li><a href="#" data-go="q'+i+'"><span class="t">'+q.number+'. '+esc(q.title)+'</span><span class="ch'+(f?'':' none')+'">'+(f?f+(x?', then '+x:''):'none')+'</span></a></li>';}).join('')+'</ol>'+
      '<p style="margin-top:24px"><button type="button" class="link" id="clear">Clear my answers in this browser</button></p>';
  } else {
    const i=+s.slice(1),q=Q[i];
    m.innerHTML=banner+'<p class="eyebrow">Question '+q.number+' of '+N+'</p>'+(q.note?'<p class="couple">'+esc(q.note)+'</p>':'')+
      '<h1>'+esc(q.title)+'</h1><p class="prompt">'+esc(prompt(q))+' A second choice is optional.</p>'+
      q.options.map(o=>'<article class="opt" data-l="'+o.letter+'">'+
        '<div class="ohead"><button type="button" class="pick" data-l="'+o.letter+'" aria-pressed="false"><span class="letter">'+o.letter+'</span><span class="state"></span></button></div>'+
        '<p class="otext">'+esc(o.text)+'</p>'+
        '<div class="oact"><button type="button" data-second="'+o.letter+'" aria-pressed="false">Second choice</button><button type="button" data-out="'+o.letter+'" aria-pressed="false">Rule out</button></div></article>').join('');
    paint();
  }}
function paint(){
  const s=st.screen;if(s[0]!=='q'){header();return;}
  const q=Q[+s.slice(1)],[f,x]=ans(q),o=outs(q);
  document.querySelectorAll('.opt').forEach(c=>{const l=c.dataset.l,F=f===l,S=x===l,O=o.includes(l);
    c.className='opt'+(F?' first':S?' second':O?' out':'');
    const p=c.querySelector('.pick');p.setAttribute('aria-pressed',F);
    p.setAttribute('aria-label','Option '+l+(F?', your first choice':S?', your second choice':O?', ruled out':'')+'. Choose as first choice');
    c.querySelector('.state').textContent=F?'First choice':S?'Second choice':O?'Ruled out':'';
    const b2=c.querySelector('[data-second]');b2.hidden=F||O;b2.setAttribute('aria-pressed',S);b2.textContent=S?'Remove second choice':'Second choice';
    const bo=c.querySelector('[data-out]');bo.setAttribute('aria-pressed',O);bo.textContent=O?'Bring back':'Rule out';bo.hidden=F;});
  header();}
$('back').addEventListener('click',()=>step(-1));
$('next').addEventListener('click',()=>step(1));
document.addEventListener('click',e=>{
  const t=e.target,b=t.closest('[data-go],[data-second],[data-out],.pick,#copy,#clear');
  const s=st.screen,q=s[0]==='q'?Q[+s.slice(1)]:null;
  if(b){
    if(b.dataset.go!==undefined){e.preventDefault();go(b.dataset.go);}
    else if(b.dataset.second){choose(q,b.dataset.second,1);}
    else if(b.dataset.out){ruleOut(q,b.dataset.out);}
    else if(b.classList.contains('pick')){if(outs(q).includes(b.dataset.l))ruleOut(q,b.dataset.l);else choose(q,b.dataset.l,0);}
    else if(b.id==='copy'){copy();}
    else if(b.id==='clear'){if(confirm('Clear all your choices in this browser?')){st=blank();save();render();}}
    return;}
  const card=t.closest('.opt');
  if(card&&q){const sel=window.getSelection&&String(window.getSelection());if(sel)return;
    if(outs(q).includes(card.dataset.l))ruleOut(q,card.dataset.l);else choose(q,card.dataset.l,0);}
});
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='TEXTAREA'||e.altKey||e.ctrlKey||e.metaKey)return;
  const s=st.screen;
  if(e.key==='ArrowRight'){if(s!=='finish'){e.preventDefault();step(1);}return;}
  if(e.key==='ArrowLeft'){if(s!=='welcome'){e.preventDefault();step(-1);}return;}
  if(s==='welcome'&&e.key==='Enter'&&e.target===document.body){e.preventDefault();step(1);return;}
  if(s[0]!=='q')return;
  const code=e.code||'',d=/^(Digit|Numpad)([1-4])$/.exec(code),k=d?+d[2]:'1234'.indexOf(e.key)+1||'abcd'.indexOf(e.key.toLowerCase())+1;
  if(k>=1&&k<=4){e.preventDefault();choose(Q[+s.slice(1)],L4[k-1],e.shiftKey?1:0);}
});
function copy(){const t=$('out'),msg=$('status');t.value=replyText();
  const ok=()=>{msg.textContent='Copied. Paste it into the chat.';$('copy').textContent='Copied';setTimeout(()=>{$('copy').textContent=D.copy_label;},4000);};
  const fallback=()=>{t.focus();t.select();try{if(!document.execCommand('copy'))throw 0;ok();}catch(x){msg.textContent='Select the text in the box and copy it.';}};
  if(navigator.clipboard&&navigator.clipboard.writeText&&window.isSecureContext!==false)navigator.clipboard.writeText(t.value).then(ok,fallback);else fallback();}
render();</script>
</body></html>
