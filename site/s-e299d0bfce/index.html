<script type="application/json" id="data">{"storage": "astro-pilot-survey-v4-a7df38326ef4c7ec", "title": "Your survey", "intro": ["Each of the 9 questions shows four descriptions. Choose the one that fits best, then Next.", "It takes about 45 minutes. Answer on your own. You can stop and come back later; your answers are saved in this browser."], "banner": null, "reply_prefix": "ME", "pause_after": 5, "questions": [{"number": 1, "title": "Your basic temperament", "text": "Which of these four descriptions fits you best? Topic: Your basic temperament.", "options": [{"letter": "A", "text": "You walk into a room of strangers and say very little for the first stretch. You stand near the wall or the kitchen counter, listen to who interrupts whom, notice who is being ignored, and join only once you know where the warmth and the tension sit. When you do join, it is fully, with a story told well and a laugh that carries, and people who saw only the quiet first half are surprised. Because your manner is soft and accommodating, newcomers take you for someone who goes along with things. They find out otherwise the first time they try to move you off a position you have settled: you smile, agree in tone, and do not budge, and weeks later you are still exactly where you were. Under the mild surface you are proud, and you remember who respected your effort and who took it for granted. What keeps you well is a reason for the work in front of you. A comfortable job with no point to it makes you flat and short-tempered within months, while a cause you believe in keeps you working late without complaint. You like your days built on a fixed frame, the same morning order, the same desk, the same route to work, and inside it you keep changing the details: a new café, a new method, a rearranged shelf. The cost is that you treat your own frame as neutral and other people's as rigid, and you resist changes you did not choose even when they are sensible."}, {"letter": "B", "text": "Walking into a room full of strangers, you find a spot near the drinks or the window and say little for the first stretch, noting who interrupts whom, who is anxious and who is being humoured. Only when you have worked out the room do you step in, usually through one well-placed question rather than a story about yourself. People take you as mild and accommodating, the tidy, pleasant one who agrees to any restaurant and remembers everyone's name, and they are startled later to find how fixed your opinions are and how long you remember a slight. Under the polite surface sits someone who has already decided, and who will wait out an argument rather than lose it; whoever thinks you are easy to steer learns otherwise on the one point you care about. What steadies you is being close to one other person who knows the whole of you. Without that, success and order feel thin, and you go about your days well organised and quietly lonely. Your days run on a frame you built yourself: the same waking hour, the same route, the same desk arrangement, the same way of loading the dishwasher. Inside that frame you rearrange constantly, swapping projects, reordering tasks and rewriting the plan for the week on a whim, yet you bristle when anyone else touches the frame itself. The cost is that you are exacting about small things and evasive about large ones, and the people closest to you know that the neatness of your desk says nothing about how settled you feel."}, {"letter": "C", "text": "You arrive fast and loud: the first opinion in the room, a quick joke, a handshake before the introductions are finished, and people decide on the spot that nothing rattles you. That impression overshoots. Underneath the brisk opening you are checking, all evening, how the one person you are actually talking to is taking you, and a flat reply from them sinks your mood for the rest of the night. At a party of near strangers you do not work the room; within ten minutes you have pulled one or two people into a corner, and you stay there, deep in a conversation that runs until the hosts begin stacking chairs. You are at your best in a pair. A day spent entirely alone, however productive, leaves you oddly hollow, and you will invent an errand just to have someone to talk to across a counter. The cost is that your own direction bends toward whoever is closest: you wake certain of your plan and go to bed having carried out a version of someone else's. You like your days to have a fixed skeleton, the same waking hour, the same walk to the same café, the same order of tasks, and you keep that frame stubbornly, yet inside it you change everything you can: a different route, a new recipe, the desk rearranged every few weeks. When something knocks out the frame itself, a cancelled week or a moved deadline, you get short with people who did not cause it, and apologise an hour later."}, {"letter": "D", "text": "When you walk into a room full of people you barely know, you take a seat with a view of the door and say very little for the first half hour. You are working out who holds the power, who is bluffing and who is bored, and only when you have the measure of the place do you join a conversation, usually with a sharp question. People who met you in that first half hour describe you as guarded, even chilly, and are surprised later to find you warm, funny and eager to talk until the early hours. What you are hungry for is something to think about: a new subject, a puzzle, a person who argues back. A week of the same conversations and the same tasks leaves you flat and irritable in a way that rest does not fix, and a single good discussion revives you faster than a holiday would. Your days run in two modes. For a stretch you keep everything in order, with lists, a clean desk, meals at fixed times and every message answered. Then something new catches your interest and the order collapses within days: dishes pile up, plans slip, and you live on the new thing until it is used up. You then rebuild the system from scratch, slightly different each time. The tension is that the same guarded manner which protects you in a new room keeps away exactly the lively, challenging people you most want to meet, and you end up waiting for them to break through a wall you built."}]}, {"number": 2, "title": "Love and attraction", "text": "Which of these four descriptions fits you best? Topic: Love and attraction.", "options": [{"letter": "A", "text": "You do not chase. When someone is interested in you, you notice early and let them do the work, answering warmly enough to keep them coming back but holding off any decision for weeks or months while you watch how they behave when tired, when crossed and when they think you are not looking. Plenty of admirers give up during that wait, and you let them go without much regret. The person who stays is usually steadier than you: someone with a regular job, a clear plan, a habit of turning up on time and calling when they said they would. Flash and drama catch your eye, but you settle with the one whose life has firm edges, and friends who expected you to fall for someone more glamorous are surprised by your choice. Underneath, the fear is of being judged. A partner's offhand comment about your clothes, your cooking or the way you told a story stays with you for days, and a pattern of small corrections is enough to end things in your mind long before you say so. You want to be admired openly, and you feel any criticism as a verdict on your whole worth. When a partner hurts you, you go quiet and cool. You keep doing the ordinary things, but the warmth drains out of your voice, you answer in single words, and you leave the room when they reach for you. The contradiction is that you choose a serious, sober partner for safety and then find that seriousness hard to bear when it is turned on you."}, {"letter": "B", "text": "You rarely make the first move. Someone notices you, keeps finding reasons to be near you, sends the second and third message, and you take weeks to decide whether you want what is on offer, watching how they treat waiters, how they speak about former loves and whether their stories hold together. Once you say yes, you attach far more deeply than your cool manner suggests. You are drawn to people who are a little lost: the one with the unfinished degree, the difficult family, the talent nobody has noticed, someone you can steady, feed and improve, and you are happiest when you are quietly sorting out their life. That pull has a price, because people who need rescuing are also the ones most likely to hide things, and what you dread most is discovering a lie: a second phone, a debt never mentioned, a version of events that shifts each time it is told. You check details others ignore, and a single inconsistency stays with you for a long time. When a partner hurts you, you do not shout. You go very quiet, answer in single words and withdraw warmth so completely that the other person feels the temperature drop in the room, while you replay what was said, word by word, in private. You call this giving yourself time; the other person calls it punishment. You come back only after you have understood exactly what happened and why, and if the hurt involved deceit, you keep a record that does not fade, even when you have chosen to stay."}, {"letter": "C", "text": "You are not drawn to the easy, available person who likes you back straight away. The ones who catch you are guarded, complicated, already half-committed elsewhere or simply hard to read, and you set about winning them with a campaign of attention: the clever message, the gesture planned for days, the evening arranged so that they see you at your best. Light flirtation bores you. You want someone who will stay up until the small hours talking about what they have never told anyone, who has a temper and a past and does not pretend otherwise, and a partner who is merely pleasant soon feels like furniture. The trouble is that the very depth you chase is what frightens you. Having chosen someone opaque, you then watch them closely for signs of a second life: the phone turned face down, the story that changes slightly on a second telling, the friend they mention too often. One discovered lie, even a small one, outweighs years of good conduct, and you keep the evidence long after the apology. When a partner wounds you, you do not shout. You go quiet, polite and unreachable, answering in single words and withholding affection until they work out what they did, which they often cannot. The silence lasts days, not hours, and you know it punishes them more than an argument would. Underneath it you want them to come after you, the same pursuit you once mounted for them, and you seldom tell them so."}, {"letter": "D", "text": "You almost never make the first move. Someone keeps turning up, asks you out twice, sends the message after the party, and you watch them for weeks, enjoying the attention and weighing them up before you say yes. Once you do decide, you turn domestic very quickly: you learn how they take their tea, you stock their favourite food, you want to know they have eaten and slept. What draws you is a person you can look after, someone a little untended who lets you fuss, and a partner who needs nothing from you leaves you oddly idle and restless. The fear running under all of this is being left. A late reply, a weekend plan made without you, a partner going quiet over dinner, and you start rehearsing the ending in your head while acting perfectly cheerful. Here is the contradiction: you let the other person do the chasing, yet once you are in, you are the one who holds on harder, keeps the photos, remembers the anniversaries and minds most when interest cools. You also give more than was asked, and then feel short-changed when it is not matched. When a partner hurts you, you do not flare up in the moment. You go polite, finish the evening, and a day or two later you ask to sit down and talk it over properly, having rehearsed every sentence. Those talks are calm and reasonable, and partners find them disarming; what they miss is that you decided before you opened your mouth whether this was forgivable."}]}, {"number": 3, "title": "How you think and talk", "text": "Which of these four descriptions fits you best? Topic: How you think and talk.", "options": [{"letter": "A", "text": "Your hard decisions are made in the body before they are made on paper. You read the options, feel one of them land as right, act on it quickly, and then build the reasoning afterwards to explain it to others. Lists of pros and cons strike you as a way of stalling. When you talk, you talk to win people over: you warm to the subject, lean in, use stories and big examples, and you know how to make a dull proposal sound like an adventure. The weakness is exaggeration. You round up, you promise more than the plan contains, and people who check the figures later find them smaller than your telling of them. You learn by plunging in. Manuals stay closed until something breaks; you try the new tool, make the mistakes in front of whoever is watching, and remember the lesson because it cost you some embarrassment. Once a problem grips you, your attention narrows to a point. You lose hours, forget to eat, and resent being pulled away to answer a question, even from someone you love. Yet in meetings and lectures that do not grip you, the same mind wanders off entirely into plans and imagined conversations, and you come back with no idea what was just agreed. So you are either completely absorbed or completely absent, with very little in between. People who rely on you learn to catch you before a problem takes hold, or to put their request in writing."}, {"letter": "B", "text": "When a decision is hard you do not trust your stomach. You collect: you read the reviews, the complaints and the small print, you ask three people the same question to compare their answers, and you build a case before you commit, often long after everyone else has stopped caring. In conversation you are fast. You talk in quick turns, change subject mid-sentence when a better thread appears, and reach for a joke or an odd comparison where someone else would give a plain answer, which makes you good company and hard to pin down. Under the quickness sits a habit of digging. Told how something works, you want to see why; handed a machine, a contract or an argument, you take it apart piece by piece and look for the weak joint, and no manual or lecture satisfies you until you have opened the thing up yourself. Your attention runs on many tracks at once: several tabs, two books half-read, a message thread going while you cook. The contradiction is that the same scattered mind, once it snags on a question that bothers it, will not let go, and you lose an evening or a whole night chasing one detail while a dozen other open tasks wait. Much of this thinking happens privately; people see the quick talk and miss how much you have already worked out before you speak, and they are caught off guard when you produce a fully built objection to a plan they thought you had barely heard."}, {"letter": "C", "text": "When a decision is hard, you do not draw up a list of pros and cons. You get a strong feeling within the first few minutes, act on it, and build the reasons afterwards, and once you have committed you defend the choice with more certainty than you actually feel. You speak the same way: you say what you think, plainly, and you correct people in meetings and at dinner tables when they are wrong, which earns you a reputation for honesty and a few lasting enemies. You overstate your case when you are excited, and a point that began as a doubt ends as a firm rule by the time you finish the sentence. Later, alone, you replay the conversation and wince at the face of the person you contradicted, but you rarely take the words back. You learn by plunging in. Manuals bore you; you would rather try the new software, the new recipe or the new job, make three obvious mistakes, and work out the method from the wreckage, and you get there faster this way than people who read first. Your attention runs on several tracks at once. You keep a dozen tabs open, two books half read and a conversation going in another window, and a single task held for an hour without interruption feels like a punishment. The cost is that the details slip: the date in the email, the second question in the letter, the name you were told at the beginning of the evening. You are sharp about the big picture and careless with the small print."}, {"letter": "D", "text": "Faced with a hard choice, you know your answer early, often before you can say why, from a physical sense that something about a person or a plan is off or right. You then spend days collecting reasons for what you already decided, and you act on that first reading far more often than on the figures, even when the figures disagree. In conversation you say much less than you think. You let others talk, ask one pointed question that shows you heard what they were avoiding, and hold your own view back until you are certain of it; people who mistake your silence for agreement are surprised by how firm you are once you finally speak. You are poor at small talk and good at the remark that ends a discussion. To learn something, you pull it apart: you open the device, read the footnotes, trace a rumour back to whoever started it, and look for the hidden mechanism or motive rather than accept the official explanation. You trust nothing you have not taken to pieces yourself. Your attention, once caught, does not let go. You spend a whole evening on one puzzle, one document or one question about why someone behaved as they did, forgetting to eat and snapping at interruptions, and you come back to the same problem for weeks after others have moved on. The cost is that you dismiss what people tell you until you have checked it, and you ignore whole areas of life that never caught your interest, leave them to someone else, and then criticise how they were handled."}]}, {"number": 4, "title": "Money and security", "text": "Which of these four descriptions fits you best? Topic: Money and security.", "options": [{"letter": "A", "text": "Money for you is about the floor beneath your feet. A healthy balance lets you sleep and be generous; a thin one makes you tense in a way you hide from people, checking the account on the bus and recalculating the month in your head. You earn best through regular, paid, daily work where effort turns predictably into wages, and you trust a payslip far more than a promising scheme. Yet your spending refuses to follow your caution. For weeks you are strict, you cook at home, cancel subscriptions and move small sums into savings, then a good mood or a long day ends with one handsome purchase: good clothes, a beautiful object, an expensive dinner for others. You enjoy that moment and then spend the following weeks paying it back with more restriction. The worry that sits deepest is not a lack of savings but the sight of savings you built being wiped out by something you could not control: a sudden job loss, a shared debt, a partner's poor decision. That fear makes you wary of mixing your money with anyone else's, and arguments about joint costs or loans hit you harder than you show. You keep a private reserve even inside a close relationship, and you do not tell your partner its size. The contradiction is plain to anyone who watches: the person who lectures about saving is also the one who orders the bottle nobody needed, and both feel entirely justified to you at the time."}, {"letter": "B", "text": "Money for you is a cushion before it is anything else. You feel calm when there is a reserve sitting untouched, a full cupboard, a fund nobody else knows about, and your mood drops the moment that reserve gets thin. Yet you do not run a steady budget. You go through tight weeks of checking every receipt and refusing small pleasures, and then a single good day, a friend's birthday or a sudden enthusiasm, breaks the discipline, and you spend in one afternoon what you saved over many weeks. Most of the splurging goes on comfort and on other people: meals out, gifts, a better coat, something soft for your rooms. The worry that actually keeps you up is not poverty but owing. Shared accounts, borrowed money, a partner who pays the rent, a loan from a parent: any arrangement in which someone else holds the purse strings makes you restless, and you will accept a worse deal to keep your own name on everything. You are vague, too, about what is owed to you and by whom, and that vagueness has already cost you real money. You earn best with more than one stream running: a job plus freelance work, a side trade in something you know well, small sums from several places rather than one large salary that depends on a single employer's goodwill. Pinned to one source of income, you feel trapped and start looking around within weeks, which looks flighty to others and feels like safety to you."}, {"letter": "C", "text": "Money with you runs hot and cold. For weeks you watch every coin, check your balance daily and refuse small pleasures with a kind of grim satisfaction, and then a single afternoon undoes it: a flight booked on impulse, expensive equipment for a plan you have not yet begun, a round of drinks for the whole table. You do not regret these bursts while they last; the regret comes when the next statement arrives and the strict phase begins again. What money buys you is room to move. You value it less for what it keeps safe than for the doors it opens: the ability to leave a job you dislike, to travel at short notice, to say no to someone. The thing you dread is having to ask. Living on a partner's income, a parent's help or an employer's goodwill makes you tense and watchful, and you will take a worse deal to avoid owing anyone. Yet much of your income passes through other people: shared accounts, commissions, contracts, deals where your share depends on someone else's decision. You earn best with more than one stream running at once, a main job plus paid side work such as teaching, selling or advising, so that no single source holds all the power over you. The tension is plain: you want independence above everything, yet your earning keeps tying you to other people's money, and your own spending sprees are what most often put you back in the position of needing them."}, {"letter": "D", "text": "Money, for you, is the price of not having to ask anyone for anything. You count it in terms of how long you could walk away: how many weeks you could live if you quit tomorrow, whether you could leave a shared flat or a bad job without help. The thought of relying on a partner's income or a parent's goodwill bothers you more than any debt, and you have turned down help that would have made life easier because it came with a string attached. Your handling of money runs in phases. For a stretch you are severe, tracking every purchase and refusing small pleasures, and then something breaks the discipline, a piece of equipment, a trip decided in an evening, a round of drinks for everyone, and a large share of the savings goes in a few days. You do not regret those splurges much; you regret the dull weeks of rebuilding afterwards. You earn best when the income is yours to steer: freelance work, a side business, a project you started and priced yourself. A fixed salary under someone else's rules feels like a leash, and you work harder for uncertain money you control than for safe money you do not. The contradiction is plain to anyone watching: you want a solid base, a place of your own and a reserve that nobody else touches, and you keep spending the reserve on the very independence it was supposed to protect. Shared accounts and joint purchases make you tense, and you keep at least one pot of money that no one else knows about."}]}, {"number": 5, "title": "Beliefs and meaning", "text": "Which of these four descriptions fits you best? Topic: Beliefs and meaning.", "options": [{"letter": "A", "text": "You trust what is checkable. When someone makes a claim, you want to know where it came from, what the numbers are and who measured them, and a moving story without evidence leaves you colder than a dull one with it. The convictions of the family you grew up in did not survive your late school days. You looked hard at what your parents took for granted, about faith, politics, money or how life ought to be lived, found it did not hold up, and said so, and the break caused a rift at home that took a long time to settle. You did not drift away quietly; you announced it. You still argue for what you believe in the open. At a dinner, in a group chat or with a stranger online, you take up the unpopular position if you think the facts support it, and you enjoy the contest more than you admit. People who prefer to keep the peace find this tiring, and you have lost at least one friendship over a debate you refused to drop. What makes life worth living for you is understanding how things work: why people behave as they do, how a system came to be built, what lies behind the official account. You read, travel and question for this, and a stretch of time in which you learned nothing feels wasted. The contradiction is that you insist on cool evidence while defending your positions with heat, pride and a strong need to be seen to be right, and the passion runs ahead of the proof."}, {"letter": "B", "text": "What you trust in the end is your own sense of right and wrong, tested against what you have seen for yourself. Rules handed down by a teacher, an institution or a family elder carry no weight with you until you have checked them against your conscience, and when the two disagree you follow the conscience and accept the cost. That habit began at home. The beliefs you grew up with, about religion, politics and how a life should be run, were stated firmly and without much room for questions, and at some point you stopped arguing and simply left them behind, which caused more hurt in the family than any argument would have. You do not campaign for what you believe now. You dislike people who preach, and you keep your convictions out of conversation unless someone asks directly; they show instead in what you refuse to do, the shortcut you will not take, the job you turned down, the person you stopped seeing. The tension is that your break with the old beliefs was loud inside you and silent outside, so relatives still assume you share views you dropped long ago, and you let them. What gives your life its point is building something that lasts and that carries your name: a body of work, a skill brought to a high standard, a position earned without favours. Idle days leave you uneasy. You judge a good season by what now exists that did not exist before, and you are harder on yourself for wasted time than for any moral lapse."}, {"letter": "C", "text": "Your convictions have been torn down and rebuilt more than once. The views you held at school were dropped wholesale after one book or one persuasive person argued you out of them, and the same thing has happened since, each time with the same fervour as before. What stays fixed across those changes is the judge. You do not defer to a church, a party line or an expert consensus; you check things against your own sense of what is decent and act on that, even when it leaves you alone in the room. You argue for what you believe out loud. At a dinner table you are the one who will not let a careless remark pass, and you would rather lose an acquaintance than nod along to something you think is wrong. What gives all of this weight is a cause larger than you: a volunteer group, a campaign, an organisation working for people you will never meet, and you feel most like yourself on the days you give a whole weekend to it. The contradiction is sharp. You trust no authority except your own conscience, yet you need a collective to pour yourself into, and every group you join eventually asks you to toe a line. You stay longer than you should, arguing from the inside and drafting long messages to the committee, and when you finally leave you do it abruptly, without a farewell, and within months you are looking for the next group worth believing in."}, {"letter": "D", "text": "Whatever faith you grew up around did not hold you. At some point you stopped going along with it, quietly or in one hard conversation, and you have not gone back, which still causes friction with at least one older relative who considers it a phase. Yet you did not land in hard-nosed disbelief. You believe in something larger that you find difficult to name, closer to a felt presence than a doctrine, and it shows up in small private habits: a prayer or a wish at night, a candle lit on a bad day, a superstition about certain numbers, a conviction that things happen for a reason you will understand later. You almost never talk about this. With friends you play the practical, slightly cynical one who wants proof and mocks fortune-tellers and miracle cures, and very few people know you hold the beliefs you do. The split costs you: when life goes badly you have nobody to share that inner side with, and the comfort stays locked in. What makes life worth living for you is not duty or a career ladder but experience itself: falling hard for someone, a night that runs until dawn, a trip taken on short notice, the thrill of making something and watching people respond to it. You judge a stretch of your life by how many such moments it held, not by what you saved or achieved, and a run of safe, repetitive weeks leaves you feeling that you are wasting the one life you have."}]}, {"number": 6, "title": "An earlier period of your life", "text": "Which of these four accounts best describes your life between the ages of 18 and 21 (about 2017 to 2021)?", "options": [{"letter": "A", "text": "This stretch opened with you heading into study or training, and for its first half much of your energy went into learning: courses, a new subject, a teacher or mentor whose ideas you took on wholesale, and a growing sense that the plan you had been handed for your working life was not the one you wanted. Pressure about your future came from above, from parents, tutors or a first employer, and it felt heavier than what the people around you were carrying. Midway through you went through a spell of low mood and strain in your private life, when you felt hemmed in and your usual cheerfulness ran thin. The real turn came towards the end of the period. Within a few months the direction of your work changed completely: a course abandoned or switched, a first serious job taken or lost, a public role you had not expected, and with it a sudden break in how you presented yourself, with a new look, a new circle and new rules. It did not feel planned. Events moved faster than your decisions, and you found yourself in a position of responsibility you had not applied for, watched and judged by people with power over your next step. What you built then was raw and unfinished, but the old track was gone for good, and you could not have gone back to it even had you wanted to. By the close of the period the question was no longer which path to take but how to hold on to the one that had chosen you."}, {"letter": "B", "text": "This stretch of your life was driven by close relationships, and it came apart and reshaped itself more than once. Early on, your attention swung hard towards one other person: a partner or a near partnership became the centre of your days, and you began measuring yourself through their reactions. At about the same time a setback in your standing, a rejection, a failed exam or a role you did not get, forced you to take yourself more seriously than before. The middle of the period was quieter on the surface but heavier underneath. You withdrew from some of the people you had leaned on, spent more time alone, and lost interest in plans that had excited you only months earlier, as if something was closing down to make room. Towards its end came the second and larger shift. A relationship or partnership broke open suddenly, through a decision of the other person's, an unexpected change of circumstances, or your own abrupt wish to be free, and the familiar arrangement could not be put back together. In the same stretch your sense of where you belonged went foggy: friends you had counted on drifted, the group you had grown up around stopped feeling like yours, and you were unsure for months what you actually wanted. The two threads pulled against each other. Outwardly you were dealing with a person, a break and its practical consequences; inwardly you were quietly rebuilding your idea of yourself, and the outer upheaval was what forced the inner work to finish."}, {"letter": "C", "text": "This period opened with the ground at home shifting under you. Early on, the arrangement you had grown up inside stopped holding: a move out, a change in who lived where, a parent's situation altering without warning, and you were handed more responsibility for your own life than you felt ready to carry. You became serious quickly and visibly more guarded. Through the middle of the period your attention kept being pulled back toward home rather than away from it; plans for training or a first proper job stalled around family needs, and someone in authority blocked or delayed a route you had counted on. Towards its end came a second and sharper break. The emotional base you had relied on gave way: a home you thought of as yours came to an end, a close bond with a mother figure or with the whole household was strained to the point of rupture, and relief and grief arrived together. At the same time the question of what you would do with your working life became urgent and could not be put off; a direction you had half chosen was forced into the open, and you had to admit that it no longer fit. The pull of this stretch lay between duty to the people at home and the need to cut your own path, and you did not resolve it gently. You came out of the period with fewer illusions about family, a smaller circle you trusted, and a clear sense that from then on any security would have to be built by you alone."}, {"letter": "D", "text": "Early in this period your home life came apart and was rebuilt. The arrangement you had grown up with ended abruptly: you left the family home, or the household itself changed shape around you through a move, a separation or a sudden change in who lived where, and you found yourself responsible for a base of your own sooner than you expected. The break felt less like an escape than like being pushed out of a nest that had already stopped holding you, and for a while your moods rose and fell with the state of your rooms and the news from relatives. Questions of where you belonged took far more of your attention than study or ambition, which ran in the background. Towards the middle the dust settled, and you began setting the place up your way, choosing the furniture, the routines and the people allowed in. Then, towards the end of the period, a second test arrived, this time about money and standing on your own feet: income fell short of what your new independence required, you took on work you did not enjoy to cover costs, and you learned to count what you had in a way you never needed to before. That second shift was slower and heavier than the first. Where the early break was sudden and quickly over, the later pressure dragged on for many months and changed how you judged your own worth. By the close of the period you had a home that was clearly yours and a much harder view of what it costs to keep one."}]}, {"number": 7, "title": "A recent period of your life", "text": "Which of these four accounts best describes your life between the ages of 22 and 25 (about 2021 to 2025)?", "options": [{"letter": "A", "text": "This period opened gently, with steadier footing and a sense that the effort of the years before was finally starting to pay. Then the pressure built. Around the middle of the period your working life came under a sustained test: a demanding manager, a role that asked more than it paid, a qualification to finish, or a venture of your own that swallowed every evening. You did not change direction. You dug in, learned the unglamorous parts of the job properly, and built routines that held, and by the end of that stretch your position was firmer, your skills were real rather than promised, and people treated you as someone who could be left in charge. The cost fell on your body. The same months that tightened your working days also forced your attention onto your health: tiredness that a weekend no longer fixed, a back, a stomach or a sleep pattern that complained, and a decision to change what you ate, how you moved or how late you stayed at the desk. Daily habits became a project in their own right, with lists, alarms and rules you kept far more strictly than anyone expected of you. The tension of the period was that the more you organised, the less room you left for the spontaneity that usually carries you, and you missed it badly. Towards its end the strain lifted: the effort was noticed, a lucky opening or two arrived, and you finished the period with a firmer hold on your own work and a clearer sense of what you would and would not give for it."}, {"letter": "B", "text": "This period was about work and public standing, and it opened something new rather than repairing something old. Early on the old structure ran out. The pressure came from people above you, a manager, a teacher or an institution, demanding more than you wanted to give, and soon after came a sudden break in your direction: a job ended, a course was changed, or you walked away from the path you had been on and began again on different terms. Alongside this ran a strong pull towards learning: further study, a training, a foreign language or time abroad, and a long spell of reading and writing that changed how you talk about what you do. Through the middle you were building quietly, testing ideas and gaining skills without much outside recognition. The main shift fell towards the end. Your work became visible: a promotion, a new and more public role, a project with your name on it, or a decision about your career that you had put off for a long time and finally made. It did not arrive cleanly. In the same stretch your private life and your energy came under strain. Home and family needed you at exactly the moment work did, you slept badly, and for a while you were unsure whether the role you had won was the one you really wanted. You ended the period more exposed and more committed than you were at its opening, carrying responsibilities that could not easily be handed back to anyone else."}, {"letter": "C", "text": "This period put work at the centre. Early on, a promising opening came your way, a role or project that looked like a big step, and you took it with more optimism than planning. The middle of the period is where the real turn came. For a long stretch things that had seemed clear went foggy: you lost confidence in the direction you were on, people above you demanded proof, and you had the sense that your effort was not being seen. Out of that pressure you settled on a more serious path and took on a position with real responsibility, the first role in which your name was attached to results and other people depended on you. It was not glamorous. It meant fixed hours, a boss or a client who held you to account, and a narrower life than you had planned, but it was the start of something solid. Alongside this, your private life was unsettled. Just before that middle stretch a relationship broke open suddenly, with someone leaving or a fierce change than any promise made out loud."}], "note": "In these two questions, Person A is you and Person B is your partner."}, {"number": 9, "title": "Friction and repair", "text": "Which of these four descriptions fits the two of you best? Topic: Friction and repair.", "options": [{"letter": "A", "text": "Between Person A and Person B, trouble rarely announces itself. Small grievances get filed away for weeks: the plan cancelled at short notice, the evening Person A spent with other people, the message left unanswered. Neither raises them at the time, and then one ordinary remark about a late arrival sets off the whole collected list at once, to the surprise of anyone watching. Once the row is under way, Person B presses: following Person A from room to room, repeating the question, wanting an answer now rather than tomorrow. Person A goes cold and still, gives one-word replies, and finally leaves the flat or shuts a door, which Person B takes as proof that the matter is being dodged. The subject underneath is nearly always the same, how much of their free time belongs to the couple and how much to each of them alone: a weekend away with friends, a hobby that eats every weekend, a wish for a night in without company. The odd thing is that a pair who explode so suddenly mend things so methodically. Once tempers drop, they sit down and go over the whole argument line by line, who said what, what it meant, what each of them will do differently, and the talk lasts until each feels heard; a quick hug and moving on does not count as settled for them. The same habit governs large choices. A new job, a move or a joint purchase is debated across many evenings, lists are drawn up and revised, and nothing is agreed until each of them says yes."}, {"letter": "B", "text": "Disagreements between Person A and Person B almost always open with Person B saying out loud what is wrong, often the same day and often before Person A has noticed any problem. Person A's first move is to go still: shorter answers, a sudden need to tidy or to leave the room, a polite agreement that is not agreement. The more Person B presses for an answer, the further Person A retreats, and Person B reads the retreat as contempt and presses harder. The subject that sets this off most often is money: who paid for what, whether a shared purchase was really agreed, how much of one person's savings should cover the other's plans. Person A keeps a private ledger of what belongs to whom; Person B treats money as something that flows through the couple and is hurt to discover that a separate account was being kept. Making up does not happen through a hug or a joke. Once the heat has gone, the two of them sit down, usually late at night, and go through the whole thing point by point until each has said exactly what they meant. Big decisions follow the same slow path: a move, a large purchase or a change of job is talked over across several weeks, with lists and second thoughts, and neither acts until both agree. The tension is that Person B wants every quarrel settled on the spot while their joint decisions crawl, and Person A, who stalls in the middle of a quarrel, is the one who insists on the long deliberation afterwards."}, {"letter": "C", "text": "Their arguments almost always begin with Person B saying the thing out loud. Person B notices a grievance, names it the same day, often standing in the middle of the problem itself, and expects an answer on the spot. Person A hears the first sentence and goes still: shorter replies, a locked expression, a sudden need to finish the dishes or leave the room, while the anger Person A will not show gets stored rather than spent. The harder Person B presses for a reaction, the further Person A withdraws, and Person B reads the silence as contempt, which raises the volume again. The subject they fight over most is time: how many evenings belong to the couple, whether Person B's friends, trips and late projects count as neglect, whether Person <script>
"use strict";
const $=id=>document.getElementById(id);
const D=JSON.parse($('data').textContent);
const Q=D.questions,N=Q.length,L4='ABCD';
const SCR=['welcome'];
Q.forEach((q,i)=>{SCR.push('q'+i);if(D.pause_after&&q.number===D.pause_after&&i<N-1)SCR.push('break');});
SCR.push('finish');
const wide=window.matchMedia('(min-width:760px)');
const FMIN=14,FMAX=18;
let mode='local',tab='A',undo=null;
function blank(){return {a:{},seen:{},screen:'welcome',last:null};}
function clean(s){const t=blank();if(!s||typeof s!=='object')return t;
  Q.forEach(q=>{const v=(s.a||{})[q.number];if(typeof v==='string'&&v.length===1&&L4.includes(v))t.a[q.number]=v;
    const r=(s.seen||{})[q.number];if(typeof r==='string')t.seen[q.number]=L4.split('').filter(l=>r.includes(l)).join('');});
  if(SCR.includes(s.screen))t.screen=s.screen;if(SCR.includes(s.last)&&s.last!=='welcome')t.last=s.last;return t;}
function read(){try{const v=localStorage.getItem(D.storage);localStorage.setItem(D.storage+':probe','1');localStorage.removeItem(D.storage+':probe');return v?JSON.parse(v):null;}
  catch(e){mode='tab';try{return (JSON.parse(window.name||'{}')||{})[D.storage]||null;}catch(x){return null;}}}
let st=clean(read());
function save(){const v=JSON.stringify(st);
  if(mode==='local'){try{localStorage.setItem(D.storage,v);return;}catch(e){mode='tab';}}
  let w={};try{w=JSON.parse(window.name||'{}')||{};}catch(e){}w[D.storage]=st;try{window.name=JSON.stringify(w);}catch(e){}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cur=()=>st.screen[0]==='q'?Q[+st.screen.slice(1)]:null;
const prompt=q=>q.text.replace(/\s*Topic:.*$/,'');
function group(q){return q.note?2:(D.pause_after&&q.number<=D.pause_after?0:1);}
function replyText(){const g=[];Q.forEach(q=>{const k=group(q);g[k]=(g[k]||'')+(st.a[q.number]||'-');});
  return D.reply_prefix+': '+g.filter(Boolean).join(' ');}
function seen(q,l){const r=st.seen[q.number]||'';if(!r.includes(l)){st.seen[q.number]=L4.split('').filter(x=>x===l||r.includes(x)).join('');save();}}
function go(s){if(!SCR.includes(s))return;undo=null;st.screen=s;if(s!=='welcome')st.last=s;tab='A';const q=cur();if(q){tab=st.a[q.number]||'A';seen(q,tab);}save();render();window.scrollTo(0,0);}
function step(d){const i=SCR.indexOf(st.screen)+d;if(i>=0&&i<SCR.length)go(SCR[i]);}
function resume(){if(st.last&&st.last!=='finish')return st.last;const q=Q.find(x=>!st.a[x.number]);return q?'q'+Q.indexOf(q):'finish';}
function steps(){const s=st.screen;return '<nav class="steps" aria-label="Questions">'+Q.map((q,i)=>{const here=s==='q'+i,done=!!st.a[q.number];
    return (D.pause_after&&i>0&&Q[i-1].number===D.pause_after?'<span class="gap" aria-hidden="true"></span>':'')+
      '<button type="button" data-go="q'+i+'" class="'+(done?'done ':'')+(here?'here':'')+'" aria-label="Question '+q.number+(done?', answered':', not answered')+'"'+(here?' aria-current="step"':'')+'>'+q.number+'</button>';}).join('')+
    '<button type="button" data-go="finish" class="end'+(s==='finish'?' here':'')+'"'+(s==='finish'?' aria-current="step"':'')+'>Finish</button></nav>';}
function render(){
  const m=$('main'),s=st.screen;
  if(s==='welcome'){
    m.innerHTML='<div class="page">'+(D.banner?'<div class="banner"><b>DEMO</b>'+esc(D.banner)+'</div>':'')+
      '<h1>'+esc(D.title)+'</h1>'+D.intro.map(p=>'<p>'+esc(p)+'</p>').join('')+
      '<button type="button" class="btn primary wide" id="start">'+(Object.keys(st.a).length?'Continue':'Start')+'</button></div>';
  } else if(s==='break'){
    m.innerHTML='<div class="page"><p class="big" id="breakline">Questions 1 to '+D.pause_after+' are done. You can take a break here.</p>'+
      '<button type="button" class="btn primary wide" id="continue">Continue</button>'+
      '<p><button type="button" class="linkbtn" id="back">Back</button></p></div>';
  } else if(s==='finish'){
    m.innerHTML='<header class="qh"><div class="nav1">'+steps()+'</div></header><div class="page" style="padding-top:5vh"><h1>Your answers</h1><p>Copy the line and paste it into the chat. Choose a question to change its answer.</p>'+
      '<ol class="ans" id="ans">'+Q.map((q,i)=>{const a=st.a[q.number];return '<li><button type="button" data-go="q'+i+'"><span class="n">'+q.number+'</span><span class="t">'+esc(q.title)+'</span><span class="l'+(a?'':' none')+'">'+(a||'No answer')+'</span></button></li>';}).join('')+'</ol>'+
      '<input id="out" class="reply" readonly aria-label="Your answers as one line" value="'+esc(replyText())+'">'+
      '<button type="button" class="btn primary wide" id="copy">Copy answers</button><p class="sr" id="status" role="status"></p></div>';
  } else {
    const i=+s.slice(1),q=Q[i];
    m.innerHTML='<header class="qh" id="qh"><div class="nav1"><button type="button" class="btn" id="back">Back</button>'+(D.banner?'<span class="demo">DEMO</span>':'')+steps()+
      '<span class="count">'+(i+1)+' of '+N+'</span><button type="button" class="btn primary next" id="next">Next</button></div>'+
      '<div class="qt"><h1>'+esc(q.title)+'</h1><p class="prompt">'+esc(prompt(q))+'</p>'+(q.note?'<p class="couple">'+esc(q.note)+'</p>':'')+'</div></header>'+
      '<div class="tabs" role="tablist" aria-label="Descriptions">'+q.options.map(o=>'<button type="button" role="tab" id="tab-'+o.letter+'" aria-controls="col-'+o.letter+'" data-tab="'+o.letter+'"><span>'+o.letter+'</span><span class="mk" aria-hidden="true"></span></button>').join('')+'</div>'+
      '<div class="grid" id="grid">'+q.options.map(o=>'<div class="col" id="col-'+o.letter+'" data-l="'+o.letter+'"><div class="ch"><span class="letter">'+o.letter+'</span><span class="tick">Your choice</span></div><p class="otext">'+esc(o.text)+'</p></div>').join('')+'</div>'+
      '<div class="pickbar"><button type="button" class="btn" id="pick">Choose A</button><button type="button" class="btn primary" id="next2">Next</button></div>'+
      '<p class="sr" id="status" role="status" aria-live="polite"></p>';
    paint();fit();
  }}
function paint(){
  const q=cur();if(!q)return;
  const a=st.a[q.number]||null,r=st.seen[q.number]||'',w=wide.matches;
  document.querySelectorAll('.col').forEach(c=>{const l=c.dataset.l;c.classList.toggle('on',l===tab);c.classList.toggle('chosen',l===a);
    if(w){c.setAttribute('role','button');c.tabIndex=0;c.setAttribute('aria-pressed',l===a);c.setAttribute('aria-label','Description '+l+(l===a?', your choice':''));c.removeAttribute('aria-labelledby');}
    else{c.setAttribute('role','tabpanel');c.removeAttribute('tabindex');c.removeAttribute('aria-pressed');c.removeAttribute('aria-label');c.setAttribute('aria-labelledby','tab-'+l);}});
  document.querySelectorAll('.tabs button').forEach(b=>{const l=b.dataset.tab;b.setAttribute('aria-selected',l===tab);b.tabIndex=l===tab?0:-1;
    b.classList.toggle('seen',r.includes(l)&&l!==a);b.classList.toggle('chosen',l===a);
    b.setAttribute('aria-label','Description '+l+(l===a?', your choice':r.includes(l)?', read':''));});
  const p=$('pick');p.textContent=a===tab?'Chosen':'Choose '+tab;p.setAttribute('aria-pressed',a===tab);
  ['next','next2'].forEach(id=>{const b=$(id);if(b)b.disabled=!a;});
  document.querySelectorAll('.steps button[data-go="'+st.screen+'"]').forEach(b=>b.classList.toggle('done',!!a));}
// Largest type in FMIN..FMAX at which the whole question fits the window; at FMIN the page may scroll as one unit.
function fit(){
  const g=$('grid');if(!g)return;
  if(!wide.matches){g.style.removeProperty('--fs');return;}
  const fits=()=>document.documentElement.scrollHeight<=window.innerHeight;
  let lo=FMIN,hi=FMAX;
  g.style.setProperty('--fs',hi+'px');if(fits())return;
  g.style.setProperty('--fs',lo+'px');if(!fits())return;
  while(hi-lo>0.25){const mid=(lo+hi)/2;g.style.setProperty('--fs',mid+'px');if(fits())lo=mid;else hi=mid;}
  g.style.setProperty('--fs',(Math.floor(lo*4)/4)+'px');}
function setTab(l){const q=cur();if(!q||!L4.includes(l))return;tab=l;seen(q,l);paint();
  const t=document.querySelector('.tabs');if(t&&!wide.matches){const y=t.getBoundingClientRect().top+window.scrollY;if(window.scrollY>y)window.scrollTo(0,y);}}
function choose(l){const q=cur();if(!q)return;st.a[q.number]=l;seen(q,l);if(!wide.matches)tab=l;save();paint();$('status').textContent='Description '+l+' chosen.';}
function next(){const q=cur();if(q&&!st.a[q.number])return;step(1);}
document.addEventListener('click',e=>{
  const t=e.target,b=t.closest('button,[data-go]');
  if(b){
    if(b.disabled)return;
    if(b.dataset.go!==undefined){e.preventDefault();go(b.dataset.go);}
    else if(b.id==='start')go(resume());
    else if(b.id==='continue')step(1);
    else if(b.id==='next'||b.id==='next2')next();
    else if(b.id==='back')step(-1);
    else if(b.dataset.tab)setTab(b.dataset.tab);
    else if(b.id==='pick')choose(tab);
    else if(b.id==='copy')copy();
    return;}
  const c=t.closest('.col');
  if(!c||!wide.matches||!cur())return;
  const q=cur();
  // A double or triple click selects a word or a line of text, not a description: undo the first click's choice.
  if(e.detail>1){if(undo&&undo.q===q.number){if(undo.prev)st.a[q.number]=undo.prev;else delete st.a[q.number];save();paint();}undo=null;return;}
  const sel=window.getSelection&&String(window.getSelection());if(sel)return;
  undo={q:q.number,prev:st.a[q.number]||null};
  choose(c.dataset.l);
});
document.addEventListener('keydown',e=>{
  if(e.altKey||e.ctrlKey||e.metaKey||e.target.tagName==='INPUT')return;
  const q=cur();if(!q)return;
  const onButton=e.target.tagName==='BUTTON';
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('col')){e.preventDefault();
    if(e.key==='Enter'&&st.a[q.number]===e.target.dataset.l)next();else{undo=null;choose(e.target.dataset.l);}return;}
  if(e.key==='Enter'&&!onButton){e.preventDefault();next();return;}
  const d=/^(Digit|Numpad)([1-4])$/.exec(e.code||''),k=d?+d[2]:'1234'.indexOf(e.key)+1||'abcd'.indexOf((e.key||'').toLowerCase())+1;
  if(!wide.matches){
    if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();const i=L4.indexOf(tab)+(e.key==='ArrowRight'?1:-1);if(i>=0&&i<4){setTab(L4[i]);const b=$('tab-'+L4[i]);if(b&&document.activeElement&&document.activeElement.getAttribute('role')==='tab')b.focus();}return;}
    if(k>=1&&k<=4){e.preventDefault();setTab(L4[k-1]);}
    return;}
  if(e.key==='ArrowRight'){e.preventDefault();step(1);return;}
  if(e.key==='ArrowLeft'){e.preventDefault();step(-1);return;}
  if(k>=1&&k<=4){e.preventDefault();undo=null;choose(L4[k-1]);}
